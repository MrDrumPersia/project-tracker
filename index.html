<!DOCTYPE html>

<head>

<style>

.task input[type=checkbox]{

.subnew{

.subnew input{

.subnew button{

.note-box{

.note-box textarea{

.empty{

  font-size:14px;

.status{

  color:#999;

.modal-bg{
  display:none;
  position:fixed;

  right:0;

  justify-content:center;
  padding:20px;

.modal-bg.open{

}

.modal{
  background:#fff;
  border-radius:12px;

  width:100%;

.modal h3{

  font-size:16px;
}

.modal textarea{
  flex:1;
  min-height:300px;
  font-family:monospace,Tahoma;
  font-size:13px;
  white-space:pre-wrap;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.modal-actions button{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-size:14px;
}

.btn-copy{
  background:#2563eb;

.btn-close{

  color:#333;

<body>

<div class="wrap">

<div class="hint">
💡 اطلاعات پروژه‌ها روی حساب مشترک ذخیره می‌شود و همه افرادی که لینک را دارند می‌توانند پروژه‌ها را ببینند و ویرایش کنند.
</div>

<div class="card">

<label>نام شرکت / پروژه</label>

<input
id="projName"
placeholder="مثلاً: فولاد آذین صنعت">

<label>تاریخ شروع (شمسی)</label>

<div class="jdate-row">
<select id="sYear"></select>
<select id="sMonth"></select>
<select id="sDay"></select>
</div>

<label>تاریخ اتمام (شمسی)</label>

<div class="jdate-row">
<select id="eYear"></select>
<select id="eMonth"></select>
<select id="eDay"></select>
</div>

<button
class="add-btn"
onclick="addProject()">
افزودن پروژه
</button>

</div>

<button id="tab-pending"
class="active"
onclick="setTab('pending')">
در حال انجام

onclick="setTab('done')">
تکمیل‌شده
</button>

onclick="setTab('all')">

</button>

</div>

<button onclick="openExport()">
📋 تهیه گزارش برای مدیریت
</button>

</div>

<div id="projList"></div>

<div
class="status"
id="statusLine">
</div>

</div>

<div
class="modal-bg"
id="exportModal">

<h3>گزارش پروژه‌ها</h3>

<textarea
id="exportText"
readonly></textarea>

<div class="modal-actions">

<button
class="btn-copy"
onclick="copyExport()">
کپی متن گزارش
</button>

<button
class="btn-close"
onclick="closeExport()">
بستن
</button>

</div>

</div>
</div>

<script>

/* =====================================================
   تاریخ شمسی
   ===================================================== */

function gregorianToJalali(gy,gm,gd){

const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];

let jy=(gy<=1600)?0:979;

gy-=(gy<=1600)?621:1600;

const gy2=(gm>2)?gy+1:gy;

let days=
365*gy+
parseInt((gy2+3)/4)-
parseInt((gy2+99)/100)+
parseInt((gy2+399)/400)-
80+gd+gdm[gm-1];

jy+=33*parseInt(days/12053);

days%=12053;

jy+=4*parseInt(days/1461);

days%=1461;

if(days>365){

jy+=parseInt((days-1)/365);

days=(days-1)%365;
}

const jm=
days<186
?1+parseInt(days/31)
:7+parseInt((days-186)/30);

const jd=
1+(days<186?days%31:(days-186)%30);

return [jy,jm,jd];
}


function jalaliToGregorian(jy,jm,jd){

let gy=(jy<=979)?621:1600;

jy-=(jy<=979)?0:979;

let days=
365*jy+
parseInt(jy/33)*8+
parseInt(((jy%33)+3)/4)+
78+
jd+
(jm<7?(jm-1)*31:(jm-7)*30+186);

gy+=400*parseInt(days/146097);

days%=146097;

if(days>36524){

gy+=100*parseInt(--days/36524);

days%=36524;

if(days>=365)days++;
}

gy+=4*parseInt(days/1461);

days%=1461;

if(days>365){

gy+=parseInt((days-1)/365);

days=(days-1)%365;
}

let gd=days+1;

const sal=[
0,
31,
((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,
31,30,31,30,31,31,30,31,30,31
];

let gm=1;

for(;gm<13;gm++){

if(gd<=sal[gm])break;

gd-=sal[gm];
}

return [gy,gm,gd];
}


const jMonthNames=[
'فروردین','اردیبهشت','خرداد','تیر',
'مرداد','شهریور','مهر','آبان',
'آذر','دی','بهمن','اسفند'
];

const faDigits=[
'۰','۱','۲','۳','۴',
'۵','۶','۷','۸','۹'
];

function toFaDigits(n){

return String(n).replace(
/[0-9]/g,
d=>faDigits[d]
);
}


function todayJalali(){

const d=new Date();

return gregorianToJalali(
d.getFullYear(),
d.getMonth()+1,
d.getDate()
);
}


function isoFromJalali(jy,jm,jd){

const [gy,gm,gd]=
jalaliToGregorian(jy,jm,jd);

return `${gy.toString().padStart(4,'0')}-${gm.toString().padStart(2,'0')}-${gd.toString().padStart(2,'0')}`;
}


function jalaliFromIso(iso){

if(!iso)return todayJalali();

const parts=String(iso).split('-').map(Number);

if(parts.length!==3)return todayJalali();

return gregorianToJalali(
parts[0],
parts[1],
parts[2]
);
}


function formatJalali(iso){

if(!iso)return '—';

const [jy,jm,jd]=jalaliFromIso(iso);

return `${toFaDigits(jd)} ${jMonthNames[jm-1]} ${toFaDigits(jy)}`;
}


/* =====================================================
   تعداد روز ماه شمسی
   ===================================================== */

function getJalaliMonthDays(year,month){

if(month<=6)return 31;

if(month<=11)return 30;

const current=
jalaliToGregorian(year,12,30);

const next=
jalaliToGregorian(year+1,1,1);

if(
current[0]===next[0] &&
current[1]===3 &&
current[2]===20
){
return 30;
}

return 29;
}


function updateDayOptions(
yearSel,
monthSel,
daySel,
selectedDay
){

const year=parseInt(yearSel.value);
const month=parseInt(monthSel.value);

const maxDay=
getJalaliMonthDays(year,month);

const oldDay=
parseInt(
selectedDay ||
daySel.value ||
1
);

daySel.innerHTML='';

for(let d=1;d<=maxDay;d++){

daySel.innerHTML+=
`<option value="${d}">
${toFaDigits(d)}
</option>`;
}

daySel.value=
Math.min(oldDay,maxDay);
}


function fillDateSelect(
yearSel,
monthSel,
daySel,
jy,
jm,
jd
){

yearSel.innerHTML='';

for(let y=jy-1;y<=jy+2;y++){

yearSel.innerHTML+=
`<option value="${y}" ${y===jy?'selected':''}>
${toFaDigits(y)}
</option>`;
}

monthSel.innerHTML='';

jMonthNames.forEach((name,i)=>{

monthSel.innerHTML+=
`<option value="${i+1}" ${i+1===jm?'selected':''}>
${name}
</option>`;
});

updateDayOptions(
yearSel,
monthSel,
daySel,
jd
);
}


function setupDateSelects(){

const [y,m,d]=todayJalali();

const sy=document.getElementById('sYear');
const sm=document.getElementById('sMonth');
const sd=document.getElementById('sDay');

const ey=document.getElementById('eYear');
const em=document.getElementById('eMonth');
const ed=document.getElementById('eDay');

fillDateSelect(sy,sm,sd,y,m,d);
fillDateSelect(ey,em,ed,y,m,d);

sy.onchange=()=>updateDayOptions(sy,sm,sd);
sm.onchange=()=>updateDayOptions(sy,sm,sd);

ey.onchange=()=>updateDayOptions(ey,em,ed);
em.onchange=()=>updateDayOptions(ey,em,ed);
}


function getIso(prefix){

const y=parseInt(
document.getElementById(prefix+'Year').value
);

const m=parseInt(
document.getElementById(prefix+'Month').value
);

const d=parseInt(
document.getElementById(prefix+'Day').value
);

return isoFromJalali(y,m,d);
}


/* =====================================================
   متغیرهای اصلی
   ===================================================== */

let projects=[];

let currentTab='pending';

let editingProjectId=null;

const API_URL='/api/projects';


/* =====================================================
   محاسبه درصد بر اساس کارها
   ===================================================== */

function calculateProgress(project){

if(
!Array.isArray(project.tasks) ||
project.tasks.length===0
){
return 0;
}

const done=
project.tasks.filter(t=>t.done===true).length;

return Math.round(
(done/project.tasks.length)*100
);
}


function updateProjectProgress(project){

project.progress=
calculateProgress(project);

return project.progress;
}


/* =====================================================
   دریافت پروژه‌ها
   ===================================================== */

async function loadProjects(){

setStatus('در حال دریافت اطلاعات...');

try{

const response=
await fetch(
API_URL,
{
method:'GET',
cache:'no-store'
}
);

if(!response.ok){

throw new Error(
`خطای سرور: ${response.status}`
);
}

const data=
await response.json();

if(!Array.isArray(data)){

throw new Error(
'اطلاعات دریافتی از سرور معتبر نیست.'
);
}

/*
  نکته مهم:
  اینجا پروژه‌های قبلی پاک نمی‌شوند.
*/

projects=data;

projects.forEach(p=>{

if(!Array.isArray(p.tasks)){
p.tasks=[];
}

/*
  اگر پروژه قبلاً کار داشته،
  درصد آن از روی کارها محاسبه می‌شود.
*/
if(p.tasks.length>0){

updateProjectProgress(p);

}

});

render();

setStatus('اطلاعات دریافت شد');

}catch(error){

console.error(
'LOAD ERROR:',
error
);

/*
  مهم:
  در صورت خطا projects را [] نمی‌کنیم.
  بنابراین اطلاعات قبلی از صفحه ناپدید نمی‌شود.
*/

setStatus(
'خطا در دریافت اطلاعات'
);

alert(
'اطلاعات از سرور دریافت نشد.\n\n'+
error.message
);
}
}


/* =====================================================
   ذخیره
   ===================================================== */

async function saveProjects(){

setStatus('در حال ذخیره...');

try{

const response=
await fetch(
API_URL,
{
method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify(projects)
}
);

const text=
await response.text();

let result={};

try{
result=JSON.parse(text);
}catch(e){}

if(!response.ok){

throw new Error(
result.error ||
'خطا در ذخیره‌سازی اطلاعات'
);
}

setStatus('ذخیره شد');

}catch(error){

console.error(
'SAVE ERROR:',
error
);

setStatus('خطا در ذخیره‌سازی');

alert(
'ذخیره‌سازی انجام نشد:\n\n'+
error.message
);
}
}


function setStatus(msg){

const el=
document.getElementById('statusLine');

el.textContent=msg;

setTimeout(()=>{

el.textContent='';

},2500);
}


/* =====================================================
   افزودن پروژه
   ===================================================== */

async function addProject(){

const input=
document.getElementById('projName');

const name=
input.value.trim();

if(!name){

alert(
'نام شرکت یا پروژه را وارد کنید'
);

return;
}

const project={

id:Date.now().toString(),

name:name,

start:getIso('s'),

end:getIso('e'),

progress:0,

tasks:[],

note:''
};

projects.unshift(project);

input.value='';

setupDateSelects();

render();

await saveProjects();
}


/* =====================================================
   حذف پروژه
   ===================================================== */

async function deleteProject(id){

if(!confirm('این پروژه حذف شود؟'))return;

projects=
projects.filter(
p=>String(p.id)!==String(id)
);

if(editingProjectId===id){
editingProjectId=null;
}

render();

await saveProjects();
}


/* =====================================================
   ویرایش
   ===================================================== */

function startEditProject(id){

editingProjectId=id;

render();
}


function cancelEditProject(){

editingProjectId=null;

render();
}


function setupEditDateSelects(
id,
prefix,
iso
){

const [y,m,d]=
jalaliFromIso(iso);

const yearSel=
document.getElementById(
`edit-${prefix}-year-${id}`
);

const monthSel=
document.getElementById(
`edit-${prefix}-month-${id}`
);

const daySel=
document.getElementById(
`edit-${prefix}-day-${id}`
);

if(
!yearSel||
!monthSel||
!daySel
)return;

fillDateSelect(
yearSel,
monthSel,
daySel,
y,m,d
);

yearSel.onchange=()=>{
updateDayOptions(
yearSel,
monthSel,
daySel
);
};

monthSel.onchange=()=>{
updateDayOptions(
yearSel,
monthSel,
daySel
);
};
}


function getEditIso(id,prefix){

const y=parseInt(
document.getElementById(
`edit-${prefix}-year-${id}`
).value
);

const m=parseInt(
document.getElementById(
`edit-${prefix}-month-${id}`
).value
);

const d=parseInt(
document.getElementById(
`edit-${prefix}-day-${id}`
).value
);

return isoFromJalali(y,m,d);
}


async function saveEditProject(id){

const project=
projects.find(
p=>String(p.id)===String(id)
);

if(!project)return;

const nameInput=
document.getElementById(
`edit-name-${id}`
);

const name=
nameInput.value.trim();

if(!name){

alert(
'نام شرکت یا پروژه را وارد کنید'
);

return;
}

project.name=name;

project.start=
getEditIso(id,'start');

project.end=
getEditIso(id,'end');

editingProjectId=null;

render();

await saveProjects();
}


/* =====================================================
   کارها
   ===================================================== */

async function addSubtask(id){

const input=
document.getElementById(
'sub-'+id
);

if(!input)return;

const text=
input.value.trim();

if(!text)return;

const project=
projects.find(
p=>String(p.id)===String(id)
);

if(!project)return;

if(!Array.isArray(project.tasks)){
project.tasks=[];
}

project.tasks.push({
text:text,
done:false
});

updateProjectProgress(project);

render();

await saveProjects();
}


async function toggleSubtask(id,idx){

const project=
projects.find(
p=>String(p.id)===String(id)
);

if(
!project||
!project.tasks||
!project.tasks[idx]
)return;

project.tasks[idx].done=
!project.tasks[idx].done;

updateProjectProgress(project);

render();

await saveProjects();
}


async function deleteSubtask(id,idx){

const project=
projects.find(
p=>String(p.id)===String(id)
);

if(!project)return;

if(
!Array.isArray(project.tasks)||
!project.tasks[idx]
)return;

project.tasks.splice(idx,1);

updateProjectProgress(project);

render();

await saveProjects();
}


/* =====================================================
   یادداشت
   ===================================================== */

async function updateNote(id,val){

const project=
projects.find(
p=>String(p.id)===String(id)
);

if(!project)return;

project.note=val;

await saveProjects();
}


/* =====================================================
   امنیت
   ===================================================== */

function escapeHtml(str){

return String(str??'').replace(
/[&<>"']/g,

m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);
}


/* =====================================================
   تب‌ها
   ===================================================== */

function setTab(tab){

currentTab=tab;

['pending','done','all']
.forEach(t=>{

document
.getElementById('tab-'+t)
.classList.toggle(
'active',
t===tab
);
});

render();
}


function getFilteredList(){

let list=
projects.slice();

if(currentTab==='pending'){

list=
list.filter(
p=>Number(p.progress)<100
);

}else if(currentTab==='done'){

list=
list.filter(
p=>Number(p.progress)>=100
);
}

return list;
}


/* =====================================================
   نمایش پروژه‌ها
   ===================================================== */

function render(){

const container=
document.getElementById(
'projList'
);

const list=
getFilteredList();

if(list.length===0){

container.innerHTML=
'<div class="empty">کاری برای نمایش نیست</div>';

return;
}

container.innerHTML=
list.map(p=>{

if(!Array.isArray(p.tasks)){
p.tasks=[];
}

/*
  همیشه درصد را از روی کارها حساب می‌کنیم.
*/

if(p.tasks.length>0){

updateProjectProgress(p);

}else{

p.progress=0;

}

const doneCount=
p.tasks.filter(
t=>t.done===true
).length;

const progress=
Number(p.progress)||0;

const isComplete=
progress>=100;

const isEditing=
editingProjectId===p.id;

return `

<div class="proj ${isComplete?'complete':''}">

<div class="proj-head">

<span class="proj-name">
${escapeHtml(p.name)}
</span>

<div class="proj-head-actions">

<button
class="edit-btn"
title="ویرایش پروژه"
onclick="startEditProject('${p.id}')">
✏️
</button>

<button
class="del-btn"
title="حذف پروژه"
onclick="deleteProject('${p.id}')">
✕
</button>

</div>

</div>


${
isEditing

?

`

<div class="edit-box">

<label>
نام شرکت / پروژه
</label>

<input
id="edit-name-${p.id}"
value="${escapeHtml(p.name)}">

<label>
تاریخ شروع (شمسی)
</label>

<div class="edit-date-row">

<select
id="edit-start-year-${p.id}">
</select>

<select
id="edit-start-month-${p.id}">
</select>

<select
id="edit-start-day-${p.id}">
</select>

</div>

<label>
تاریخ اتمام (شمسی)
</label>

<div class="edit-date-row">

<select
id="edit-end-year-${p.id}">
</select>

<select
id="edit-end-month-${p.id}">
</select>

<select
id="edit-end-day-${p.id}">
</select>

</div>

<div class="edit-actions">

<button
class="save-edit"
onclick="saveEditProject('${p.id}')">
💾 ذخیره
</button>

<button
class="cancel-edit"
onclick="cancelEditProject()">
لغو
</button>

</div>

</div>

`

:

`

<div class="proj-meta">

${
isComplete
?
'<span class="badge-done">تکمیل‌شده</span>'
:
'<span class="badge">در حال انجام</span>'
}

<span>
📅 ${formatJalali(p.start)}
</span>

<span>
🏁 ${formatJalali(p.end)}
</span>

</div>

`
}


<div class="progress-info">

<span>
📊 پیشرفت پروژه
</span>

<span class="progress-percent">
${toFaDigits(progress)}٪
</span>

</div>

<div class="bar">

<div
class="fill"
style="width:${progress}%">
</div>

</div>


<div class="section-title">

✅ کارهای انجام‌شده

(${toFaDigits(doneCount)}
از
${toFaDigits(p.tasks.length)})

</div>


${
p.tasks.length===0

?

'<div style="font-size:12px;color:#999;margin:8px 0;">هنوز کاری برای این پروژه ثبت نشده است.</div>'

:

p.tasks.map(
(t,idx)=>`

<div class="task ${t.done?'done':''}">

<input
type="checkbox"
${t.done?'checked':''}
onchange="toggleSubtask('${p.id}',${idx})">

<span>
${escapeHtml(t.text)}
</span>

<button
class="del-btn"
onclick="deleteSubtask('${p.id}',${idx})">
✕
</button>

</div>

`
).join('')
}


<div class="subnew">

<input
type="text"
placeholder="کار جدید..."
id="sub-${p.id}"
onkeydown="if(event.key==='Enter')addSubtask('${p.id}')">

<button
onclick="addSubtask('${p.id}')">
افزودن
</button>

</div>


<div class="section-title">
📝 یادداشت
</div>

<div class="note-box">

<textarea
placeholder="یادداشت..."
onchange="updateNote('${p.id}',this.value)"
>${escapeHtml(p.note||'')}</textarea>

</div>

</div>

`;

}).join('');


/*
  بعد از ساخت HTML،
  انتخابگرهای تاریخ ویرایش را فعال می‌کنیم.
*/

list.forEach(p=>{

if(editingProjectId===p.id){

setupEditDateSelects(
p.id,
'start',
p.start
);

setupEditDateSelects(
p.id,
'end',
p.end
);

}

});

}


/* =====================================================
   گزارش
   ===================================================== */

function openExport(){

let out=
`گزارش پروژه‌ها - تاریخ تهیه: ${formatJalali(todayIso())}
================================

`;

projects.forEach(p=>{

if(!Array.isArray(p.tasks)){
p.tasks=[];
}

updateProjectProgress(p);

out+=
`📌 ${p.name}
`;

out+=
`  پیشرفت: ${toFaDigits(p.progress)}٪ | `+
`شروع: ${formatJalali(p.start)} | `+
`پایان: ${formatJalali(p.end)}
`;

if(p.tasks.length){

p.tasks.forEach(t=>{

out+=
`  ${t.done?'✅':'⬜'} ${t.text}
`;

});

}

if(p.note){

out+=
`  یادداشت: ${p.note}
`;

}

out+='\n';

});

document.getElementById(
'exportText'
).value=out;

document.getElementById(
'exportModal'
).classList.add('open');
}


function todayIso(){

const d=new Date();

return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}


function closeExport(){

document.getElementById(
'exportModal'
).classList.remove('open');
}


function copyExport(){

const ta=
document.getElementById(
'exportText'
);

ta.select();

ta.setSelectionRange(
0,
999999
);

if(
navigator.clipboard &&
window.isSecureContext
){

navigator.clipboard
.writeText(ta.value)
.then(()=>{
setStatus('گزارش کپی شد');
})
.catch(()=>{
fallbackCopy(ta);
});

}else{

fallbackCopy(ta);
}
}


function fallbackCopy(ta){

try{

document.execCommand('copy');

setStatus('گزارش کپی شد');

}catch(e){

alert(
'کپی خودکار انجام نشد؛ متن را دستی کپی کنید.'
);
}
}


/* =====================================================
   شروع
   ===================================================== */

setupDateSelects();

loadProjects();

</script>
