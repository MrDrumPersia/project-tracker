<script>

/* =====================================================
تبدیل تاریخ
===================================================== */

function gregorianToJalali(gy,gm,gd){

var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];

var jy=(gy<=1600)?0:979;

gy-=(gy<=1600)?621:1600;

var gy2=(gm>2)?gy+1:gy;

var days=
365*gy+
parseInt((gy2+3)/4)-
parseInt((gy2+99)/100)+
parseInt((gy2+399)/400)-
80+gd+gdm[gm-1];

jy+=33*parseInt(days/12053);

days%=12053;

jy+=4*parseInt(days/1461);

days%=1461;

if(days>365){

jy+=parseInt((days-1)/365);

days=(days-1)%365;

}

var jm=(days<186)
?1+parseInt(days/31)
:7+parseInt((days-186)/30);

var jd=1+
(
days<186
?days%31
:(days-186)%30
);

return [jy,jm,jd];
}


function jalaliToGregorian(jy,jm,jd){

var gy=(jy<=979)?621:1600;

jy-=(jy<=979)?0:979;

var days=
365*jy+
parseInt(jy/33)*8+
parseInt(((jy%33)+3)/4)+
78+
jd+
(
jm<7
?(jm-1)*31
:((jm-7)*30)+186
);

gy+=400*parseInt(days/146097);

days%=146097;

if(days>36524){

gy+=100*parseInt(--days/36524);

days%=36524;

if(days>=365)days++;

}

gy+=4*parseInt(days/1461);

days%=1461;

if(days>365){

gy+=parseInt((days-1)/365);

days=(days-1)%365;

}

var gd=days+1;

var sal=[0,31,
((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,
31,30,31,30,31,31,30,31,30,31];

var gm;

for(gm=1;gm<13;gm++){

if(gd<=sal[gm])break;

gd-=sal[gm];

}

return [gy,gm,gd];
}


const jMonthNames=[
'فروردین','اردیبهشت','خرداد','تیر',
'مرداد','شهریور','مهر','آبان',
'آذر','دی','بهمن','اسفند'
];

const faDigits=[
'۰','۱','۲','۳','۴',
'۵','۶','۷','۸','۹'
];

function toFaDigits(n){

return String(n).replace(
/[0-9]/g,
d=>faDigits[d]
);

}


function todayJalali(){

const d=new Date();

return gregorianToJalali(
d.getFullYear(),
d.getMonth()+1,
d.getDate()
);

}


function isoFromJalali(jy,jm,jd){

const [gy,gm,gd]=
jalaliToGregorian(jy,jm,jd);

return `${String(gy).padStart(4,'0')}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`;
}


function jalaliFromIso(iso){

if(!iso)return todayJalali();

const [gy,gm,gd]=iso.split('-').map(Number);

return gregorianToJalali(gy,gm,gd);
}


function formatJalali(iso){

if(!iso)return '—';

const [jy,jm,jd]=jalaliFromIso(iso);

return `${toFaDigits(jd)} ${jMonthNames[jm-1]} ${toFaDigits(jy)}`;
}


/* =====================================================
تعداد روز ماه شمسی
===================================================== */

function getJalaliMonthDays(year,month){

if(month<=6)return 31;

if(month<=11)return 30;

const a=jalaliToGregorian(year,12,29);
const b=jalaliToGregorian(year,12,30);

if(
a[1]===3 &&
a[2]===20 &&
b[0]===a[0] &&
b[1]===3
){
return 30;
}

return 29;
}


function updateDayOptions(
yearSel,
monthSel,
daySel,
selectedDay
){

const year=parseInt(yearSel.value);

const month=parseInt(monthSel.value);

const maxDay=
getJalaliMonthDays(year,month);

const oldDay=
parseInt(
selectedDay ||
daySel.value ||
1
);

daySel.innerHTML='';

for(let d=1;d<=maxDay;d++){

daySel.innerHTML+=
`<option value="${d}">
${toFaDigits(d)}
</option>`;

}

daySel.value=
Math.min(oldDay,maxDay);
}


function fillDateSelect(
yearSel,
monthSel,
daySel,
jy,
jm,
jd
){

yearSel.innerHTML='';

for(let y=jy-1;y<=jy+2;y++){

yearSel.innerHTML+=
`<option value="${y}" ${y===jy?'selected':''}>
${toFaDigits(y)}
</option>`;

}

monthSel.innerHTML='';

jMonthNames.forEach((name,i)=>{

monthSel.innerHTML+=
`<option value="${i+1}" ${i+1===jm?'selected':''}>
${name}
</option>`;

});

updateDayOptions(
yearSel,
monthSel,
daySel,
jd
);
}


function setupDateSelects(){

const [y,m,d]=todayJalali();

fillDateSelect(
document.getElementById('sYear'),
document.getElementById('sMonth'),
document.getElementById('sDay'),
y,m,d
);

fillDateSelect(
document.getElementById('eYear'),
document.getElementById('eMonth'),
document.getElementById('eDay'),
y,m,d
);

bindDateSelects(
'sYear','sMonth','sDay'
);

bindDateSelects(
'eYear','eMonth','eDay'
);
}


function bindDateSelects(
yearId,
monthId,
dayId
){

const y=document.getElementById(yearId);
const m=document.getElementById(monthId);
const d=document.getElementById(dayId);

y.onchange=()=>updateDayOptions(y,m,d);
m.onchange=()=>updateDayOptions(y,m,d);
}


function getIso(prefix){

const y=parseInt(
document.getElementById(prefix+'Year').value
);

const m=parseInt(
document.getElementById(prefix+'Month').value
);

const d=parseInt(
document.getElementById(prefix+'Day').value
);

return isoFromJalali(y,m,d);
}


/* =====================================================
API
===================================================== */

let projects=[];

let currentTab='pending';

let editingProjectId=null;

const API_URL='/api/projects';


async function loadProjects(){

setStatus('در حال دریافت اطلاعات...');

try{

const response=await fetch(
API_URL,
{
method:'GET',
cache:'no-store'
}
);

if(!response.ok)
throw new Error('خطا در دریافت اطلاعات');

const data=await response.json();

projects=
Array.isArray(data)?data:[];

/* اطمینان از ساختار قدیمی */

projects.forEach(p=>{

if(!Array.isArray(p.tasks))
p.tasks=[];

p.progress=
calculateProgress(p);

});

render();

setStatus('اطلاعات دریافت شد');

}catch(error){

console.error(error);

projects=[];

render();

setStatus('خطا در دریافت اطلاعات');

}

}


/* =====================================================
محاسبه خودکار درصد
===================================================== */

function calculateProgress(project){

if(
!project.tasks ||
!project.tasks.length
){
return 0;
}

const done=
project.tasks.filter(
t=>t.done
).length;

return Math.round(
(done/project.tasks.length)*100
);
}


/* =====================================================
ذخیره
===================================================== */

async function saveProjects(){

setStatus('در حال ذخیره...');

try{

/* همیشه درصد را قبل از ذخیره محاسبه کن */

projects.forEach(p=>{
p.progress=calculateProgress(p);
});

const response=
await fetch(
API_URL,
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(projects)
}
);

if(!response.ok){

let msg='خطا در ذخیره‌سازی';

try{

const data=await response.json();

if(data.error)
msg=data.error;

}catch(e){}

throw new Error(msg);
}

setStatus('ذخیره شد');

}catch(error){

console.error(error);

setStatus('خطا در ذخیره‌سازی');

alert(
'ذخیره‌سازی انجام نشد:\n'+
error.message
);

}

}


function setStatus(msg){

const el=
document.getElementById('statusLine');

el.textContent=msg;

setTimeout(()=>{
el.textContent='';
},2500);
}


/* =====================================================
افزودن پروژه
===================================================== */

async function addProject(){

const name=
document.getElementById('projName')
.value.trim();

if(!name){

alert('نام شرکت یا پروژه را وارد کنید');

return;
}

projects.unshift({

id:Date.now().toString(),

name:name,

start:getIso('s'),

end:getIso('e'),

progress:0,

tasks:[],

note:''

});

document.getElementById('projName').value='';

setupDateSelects();

render();

await saveProjects();
}


/* =====================================================
حذف پروژه
===================================================== */

async function deleteProject(id){

if(!confirm('این پروژه حذف شود؟'))
return;

projects=
projects.filter(
p=>p.id!==id
);

if(editingProjectId===id)
editingProjectId=null;

render();

await saveProjects();
}


/* =====================================================
ویرایش پروژه
===================================================== */

function startEditProject(id){

editingProjectId=id;

render();
}


function cancelEditProject(){

editingProjectId=null;

render();
}


function setupEditDateSelects(
id,
prefix,
iso
){

const [y,m,d]=
jalaliFromIso(iso);

const ys=
document.getElementById(
`edit-${prefix}-year-${id}`
);

const ms=
document.getElementById(
`edit-${prefix}-month-${id}`
);

const ds=
document.getElementById(
`edit-${prefix}-day-${id}`
);

if(!ys||!ms||!ds)
return;

fillDateSelect(
ys,ms,ds,y,m,d
);

ys.onchange=
()=>updateDayOptions(ys,ms,ds);

ms.onchange=
()=>updateDayOptions(ys,ms,ds);
}


function getEditIso(id,prefix){

const y=parseInt(
document.getElementById(
`edit-${prefix}-year-${id}`
).value
);

const m=parseInt(
document.getElementById(
`edit-${prefix}-month-${id}`
).value
);

const d=parseInt(
document.getElementById(
`edit-${prefix}-day-${id}`
).value
);

return isoFromJalali(y,m,d);
}


async function saveEditProject(id){

const project=
projects.find(p=>p.id===id);

if(!project)
return;

const nameInput=
document.getElementById(
`edit-name-${id}`
);

const name=
nameInput.value.trim();

if(!name){

alert('نام شرکت یا پروژه را وارد کنید');

return;
}

const start=
getEditIso(id,'start');

const end=
getEditIso(id,'end');

project.name=name;

project.start=start;

project.end=end;

editingProjectId=null;

render();

await saveProjects();
}


/* =====================================================
افزودن کار
===================================================== */

async function addSubtask(id){

const input=
document.getElementById('sub-'+id);

const text=input.value.trim();

if(!text)
return;

const project=
projects.find(p=>p.id===id);

if(!project)
return;

if(!Array.isArray(project.tasks))
project.tasks=[];

project.tasks.push({

text:text,

done:false

});

/* درصد خودکار */

project.progress=
calculateProgress(project);

render();

await saveProjects();
}


/* =====================================================
تغییر وضعیت کار
===================================================== */

async function toggleSubtask(id,idx){

const project=
projects.find(p=>p.id===id);

if(
!project ||
!project.tasks ||
!project.tasks[idx]
)
return;

project.tasks[idx].done=
!project.tasks[idx].done;

/* درصد خودکار */

project.progress=
calculateProgress(project);

render();

await saveProjects();
}


/* =====================================================
حذف کار
===================================================== */

async function deleteSubtask(id,idx){

const project=
projects.find(p=>p.id===id);

if(!project)
return;

project.tasks.splice(idx,1);

/* درصد خودکار */

project.progress=
calculateProgress(project);

render();

await saveProjects();
}


/* =====================================================
یادداشت
===================================================== */

async function updateNote(id,val){

const project=
projects.find(p=>p.id===id);

if(!project)
return;

project.note=val;

await saveProjects();
}


/* =====================================================
امنیت HTML
===================================================== */

function escapeHtml(str){

return String(str).replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);
}


/* =====================================================
تب
===================================================== */

function setTab(tab){

currentTab=tab;

['pending','done','all'].forEach(t=>{

document
.getElementById('tab-'+t)
.classList.toggle(
'active',
t===tab
);

});

render();
}


function getFilteredList(){

let list=projects.slice();

if(currentTab==='pending'){

list=list.filter(
p=>Number(p.progress)<100
);

}

else if(currentTab==='done'){

list=list.filter(
p=>Number(p.progress)>=100
);

}

return list;
}


/* =====================================================
نمایش پروژه‌ها
===================================================== */

function render(){

const container=
document.getElementById('projList');

const list=
getFilteredList();

if(!list.length){

container.innerHTML=
'<div class="empty">کاری برای نمایش نیست</div>';

return;
}

container.innerHTML=
list.map(p=>{

if(!Array.isArray(p.tasks))
p.tasks=[];

/* همیشه درصد از روی کارها */

p.progress=
calculateProgress(p);

const doneCount=
p.tasks.filter(t=>t.done).length;

const isComplete=
p.progress>=100;

const isEditing=
editingProjectId===p.id;

return `

<div class="proj ${isComplete?'complete':''}">

<div class="proj-head">

<span class="proj-name">
${escapeHtml(p.name)}
</span>

<div class="proj-head-actions">

<button
class="edit-btn"
title="ویرایش پروژه"
onclick="startEditProject('${p.id}')">
✏️
</button>

<button
class="del-btn"
title="حذف پروژه"
onclick="deleteProject('${p.id}')">
✕
</button>

</div>

</div>


${
isEditing

?

`

<div class="edit-box">

<label>
نام شرکت / پروژه
</label>

<input
id="edit-name-${p.id}"
value="${escapeHtml(p.name)}">


<label>
تاریخ شروع (شمسی)
</label>

<div class="edit-date-row">

<select id="edit-start-year-${p.id}"></select>

<select id="edit-start-month-${p.id}"></select>

<select id="edit-start-day-${p.id}"></select>

</div>


<label>
تاریخ اتمام (شمسی)
</label>

<div class="edit-date-row">

<select id="edit-end-year-${p.id}"></select>

<select id="edit-end-month-${p.id}"></select>

<select id="edit-end-day-${p.id}"></select>

</div>


<div class="edit-actions">

<button
class="save-edit"
onclick="saveEditProject('${p.id}')">
💾 ذخیره تغییرات
</button>

<button
class="cancel-edit"
onclick="cancelEditProject()">
لغو
</button>

</div>

</div>

`

:

`

<div class="proj-meta">

${
isComplete
?
'<span class="badge-done">تکمیل‌شده</span>'
:
'<span class="badge">در حال انجام</span>'
}

<span>
📅 ${formatJalali(p.start)}
</span>

<span>
🏁 ${formatJalali(p.end)}
</span>

</div>

`

}


<div class="progress-info">

<span>
📊 پیشرفت پروژه
</span>

<span class="progress-percent">
${toFaDigits(p.progress)}٪
</span>

</div>


<div class="bar">

<div
class="fill"
style="width:${p.progress}%">
</div>

</div>


<div class="section-title">

✅ کارهای انجام‌شده

(${toFaDigits(doneCount)}
از
${toFaDigits(p.tasks.length)})

</div>


${
p.tasks.map(
(t,idx)=>`

<div class="task ${t.done?'done':''}">

<input
type="checkbox"
${t.done?'checked':''}
onchange="toggleSubtask('${p.id}',${idx})">

<span>
${escapeHtml(t.text)}
</span>

<button
class="del-btn"
onclick="deleteSubtask('${p.id}',${idx})">
✕
</button>

</div>

`
).join('')
}


<div class="subnew">

<input
type="text"
placeholder="کار جدید..."
id="sub-${p.id}"
onkeydown="if(event.key==='Enter')addSubtask('${p.id}')">

<button
onclick="addSubtask('${p.id}')">
افزودن
</button>

</div>


<div class="section-title">
📝 یادداشت
</div>


<div class="note-box">

<textarea
placeholder="یادداشت..."
onchange="updateNote('${p.id}',this.value)"
>${escapeHtml(p.note||'')}</textarea>

</div>

</div>

`;

}).join('');


/* فعال کردن تاریخ‌های ویرایش */

list.forEach(p=>{

if(editingProjectId===p.id){

setupEditDateSelects(
p.id,
'start',
p.start
);

setupEditDateSelects(
p.id,
'end',
p.end
);

}

});

}


/* =====================================================
گزارش
===================================================== */

function openExport(){

let out=
`گزارش پروژه‌ها - تاریخ تهیه: ${formatJalali(todayIso())}\n`+
`================================\n\n`;

projects.forEach(p=>{

p.progress=
calculateProgress(p);

out+=
`📌 ${p.name}\n`;

out+=
`  پیشرفت: ${toFaDigits(p.progress)}٪ | `+
`شروع: ${formatJalali(p.start)} | `پایان: ${formatJalali(p.end)}\n`;

if(p.tasks&&p.tasks.length){

p.tasks.forEach(t=>{

out+=
`  ${t.done?'✅':'⬜'} ${t.text}\n`;

});

}

if(p.note){

out+=
`  یادداشت: ${p.note}\n`;

}

out+='\n';

});

document.getElementById(
'exportText'
).value=out;

document.getElementById(
'exportModal'
).classList.add('open');
}


function todayIso(){

const d=new Date();

return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}


function closeExport(){

document.getElementById(
'exportModal'
).classList.remove('open');
}


function copyExport(){

const ta=
document.getElementById('exportText');

ta.select();

ta.setSelectionRange(0,999999);

navigator.clipboard
.writeText(ta.value)
.then(()=>setStatus('گزارش کپی شد'))
.catch(()=>{

document.execCommand('copy');

setStatus('گزارش کپی شد');

});

}


/* =====================================================
شروع
===================================================== */

setupDateSelects();

loadProjects();

</script>

</body>
</html>
