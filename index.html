<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیگیری پروژه‌ها</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Tahoma,Vazirmatn,Arial,sans-serif;
  background:#f4f5f7;
  margin:0;
  padding:16px;
  color:#222;
}

.wrap{
  max-width:760px;
  margin:auto;
}

.hint{
  background:#eef2ff;
  color:#3730a3;
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-size:13px;
  margin-bottom:14px;
  line-height:2;
}

.card,.proj,.summary-card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  color:#555;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #dcdfe4;
  border-radius:9px;
  font-family:inherit;
  font-size:14px;
  background:#fafbfc;
  margin-bottom:11px;
}

textarea{
  min-height:70px;
  resize:vertical;
}

.row{
  display:flex;
  gap:8px;
}

.row>div{
  flex:1;
}

.date-row{
  display:flex;
  gap:6px;
}

.date-row select{
  flex:1;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.add-btn{
  width:100%;
  border:none;
  border-radius:10px;
  padding:13px;
  background:#2563eb;
  color:white;
  font-size:15px;
  font-weight:bold;
}

.tabs{
  display:flex;
  gap:6px;
  margin-bottom:12px;
}

.tabs button{
  flex:1;
  border:none;
  padding:11px;
  border-radius:9px;
  background:#e5e7eb;
}

.tabs button.active{
  background:#2563eb;
  color:#fff;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.summary-card{
  margin:0;
  text-align:center;
  padding:13px 8px;
}

.summary-card strong{
  display:block;
  font-size:22px;
  margin-bottom:5px;
}

.summary-card span{
  font-size:11px;
  color:#777;
}

.proj{
  border-right:5px solid #2563eb;
}

.proj.complete{
  border-right-color:#16a34a;
  background:#f4fff7;
}

.proj.warning{
  border-right-color:#f59e0b;
}

.proj.overdue{
  border-right-color:#dc2626;
}

.proj-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.proj-name{
  font-weight:bold;
  font-size:16px;
}

.actions{
  display:flex;
  gap:3px;
}

.icon-btn{
  border:none;
  background:transparent;
  padding:5px 7px;
  font-size:16px;
}

.edit-btn{color:#2563eb}
.del-btn{color:#dc2626}

.meta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  font-size:12px;
  color:#777;
  margin:12px 0;
}

.badge{
  padding:3px 9px;
  border-radius:20px;
  font-size:11px;
  background:#eef2ff;
  color:#3730a3;
}

.badge.done{
  background:#dcfce7;
  color:#166534;
}

.badge.warning{
  background:#fef3c7;
  color:#92400e;
}

.badge.overdue{
  background:#fee2e2;
  color:#991b1b;
}

.bar{
  width:100%;
  height:10px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,#3b82f6,#1d4ed8);
}

.progress-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0;
}

.progress-row strong{
  color:#1d4ed8;
}

.section-title{
  font-size:13px;
  font-weight:bold;
  margin:16px 0 7px;
}

.task{
  display:flex;
  align-items:center;
  gap:8px;
  background:#fafafa;
  border:1px solid #eee;
  padding:8px;
  border-radius:9px;
  margin-bottom:6px;
}

.task.done{
  background:#f0fdf4;
}

.task.done .task-text{
  text-decoration:line-through;
  color:#888;
}

.task-text{
  flex:1;
  word-break:break-word;
}

.task input{
  width:17px;
  height:17px;
  margin:0;
}

.task-edit{
  flex:1;
  margin:0;
  padding:7px;
}

.subnew{
  display:flex;
  gap:6px;
}

.subnew input{
  margin:0;
}

.subnew button{
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:0 15px;
}

.note-box{
  background:#fffdf4;
  border:1px solid #f5e9b7;
  border-right:4px solid #eab308;
  border-radius:9px;
}

.note-box textarea{
  border:none;
  background:transparent;
  margin:0;
}

.edit-box{
  background:#f8fafc;
  border:1px solid #dbe3ef;
  border-radius:10px;
  padding:12px;
  margin:12px 0;
}

.edit-actions{
  display:flex;
  gap:7px;
}

.edit-actions button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
}

.save{
  background:#16a34a;
  color:#fff;
}

.cancel{
  background:#e5e7eb;
}

.report-btn{
  width:100%;
  padding:12px;
  background:#fff;
  color:#2563eb;
  border:1px solid #2563eb;
  border-radius:10px;
  font-weight:bold;
  margin-bottom:14px;
}

.status{
  text-align:center;
  min-height:20px;
  color:#777;
  font-size:12px;
  margin-top:10px;
}

.empty{
  text-align:center;
  padding:35px;
  color:#999;
}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:100;
  padding:20px;
  align-items:center;
  justify-content:center;
}

.modal-bg.open{
  display:flex;
}

.modal{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  padding:18px;
}

.modal h3{
  margin-top:0;
}

.report{
  line-height:2;
  font-size:14px;
}

.report-head{
  text-align:center;
  border-bottom:2px solid #2563eb;
  padding-bottom:12px;
  margin-bottom:15px;
}

.report-project{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}

.report-project h4{
  margin:0 0 8px;
}

.report-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.report-actions button{
  flex:1;
  border:none;
  padding:11px;
  border-radius:8px;
}

.copy-btn{
  background:#2563eb;
  color:white;
}

.close-btn{
  background:#e5e7eb;
}

@media(max-width:550px){
  .summary{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="hint">
💡 اطلاعات پروژه‌ها به صورت مشترک ذخیره می‌شود.
</div>

<div class="card">

<label>نام شرکت / پروژه</label>
<input id="projName" placeholder="مثلاً: فولاد آذین صنعت">

<div class="row">
<div>
<label>تاریخ شروع (شمسی)</label>
<div class="date-row">
<select id="sYear"></select>
<select id="sMonth"></select>
<select id="sDay"></select>
</div>
</div>
</div>

<div class="row">
<div>
<label>تاریخ اتمام (شمسی)</label>
<div class="date-row">
<select id="eYear"></select>
<select id="eMonth"></select>
<select id="eDay"></select>
</div>
</div>
</div>

<button class="add-btn" onclick="addProject()">افزودن پروژه</button>

</div>

<div class="summary">
<div class="summary-card">
<strong id="sumAll">۰</strong>
<span>کل پروژه‌ها</span>
</div>

<div class="summary-card">
<strong id="sumPending">۰</strong>
<span>در حال انجام</span>
</div>

<div class="summary-card">
<strong id="sumDone">۰</strong>
<span>تکمیل‌شده</span>
</div>
</div>

<div class="tabs">
<button id="tab-pending" class="active" onclick="setTab('pending')">در حال انجام</button>
<button id="tab-done" onclick="setTab('done')">تکمیل‌شده</button>
<button id="tab-all" onclick="setTab('all')">همه</button>
</div>

<button class="report-btn" onclick="openReport()">📋 تهیه گزارش مدیریت</button>

<div id="projList"></div>

<div id="statusLine" class="status"></div>

</div>

<div id="reportModal" class="modal-bg">
<div class="modal">

<h3>گزارش مدیریت</h3>

<div id="reportContent" class="report"></div>

<div class="report-actions">
<button class="copy-btn" onclick="copyReport()">کپی گزارش</button>
<button class="close-btn" onclick="closeReport()">بستن</button>
</div>

</div>
</div>

<script>

/* ================= تاریخ شمسی ================= */

const months=[
'فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور',
'مهر','آبان','آذر','دی','بهمن','اسفند'
];

const digits=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function fa(n){
return String(n).replace(/[0-9]/g,x=>digits[x]);
}

function gregorianToJalali(gy,gm,gd){

let g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
let jy=gy<=1600?0:979;

gy-=gy<=1600?621:1600;

let gy2=gm>2?gy+1:gy;

let days=
365*gy+
Math.floor((gy2+3)/4)-
Math.floor((gy2+99)/100)+
Math.floor((gy2+399)/400)-
80+gd+g_d_m[gm-1];

jy+=33*Math.floor(days/12053);
days%=12053;

jy+=4*Math.floor(days/1461);
days%=1461;

if(days>365){
jy+=Math.floor((days-1)/365);
days=(days-1)%365;
}

let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
let jd=1+(days<186?days%31:(days-186)%30);

return[jy,jm,jd];
}

function jalaliToGregorian(jy,jm,jd){

let gy=jy<=979?621:1600;

jy-=jy<=979?0:979;

let days=
365*jy+
Math.floor(jy/33)*8+
Math.floor(((jy%33)+3)/4)+
78+jd+
(jm<7?(jm-1)*31:(jm-7)*30+186);

gy+=400*Math.floor(days/146097);
days%=146097;

if(days>36524){
gy+=100*Math.floor(--days/36524);
days%=36524;
if(days>=365)days++;
}

gy+=4*Math.floor(days/1461);
days%=1461;

if(days>365){
gy+=Math.floor((days-1)/365);
days=(days-1)%365;
}

let gd=days+1;

let sal=[
0,31,
((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,
31,30,31,30,31,31,30,31,30,31
];

let gm;

for(gm=1;gm<13;gm++){
if(gd<=sal[gm])break;
gd-=sal[gm];
}

return[gy,gm,gd];
}

function todayJalali(){
let d=new Date();
return gregorianToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
}

function isoFromJalali(y,m,d){
let r=jalaliToGregorian(y,m,d);
return `${r[0]}-${String(r[1]).padStart(2,'0')}-${String(r[2]).padStart(2,'0')}`;
}

function jalaliFromIso(iso){
if(!iso)return todayJalali();
let p=iso.split('-').map(Number);
return gregorianToJalali(p[0],p[1],p[2]);
}

function formatDate(iso){
if(!iso)return'—';
let p=jalaliFromIso(iso);
return `${fa(p[2])} ${months[p[1]-1]} ${fa(p[0])}`;
}

function maxDays(year,month){
if(month<=6)return 31;
if(month<=11)return 30;

let g=jalaliToGregorian(year,12,30);
let next=jalaliToGregorian(year+1,1,1);

return(
g[0]===next[0]&&
g[1]===3&&
g[2]===20
)?30:29;
}

function updateDays(y,m,d,selected){

let year=Number(y.value);
let month=Number(m.value);
let max=maxDays(year,month);
let old=selected||Number(d.value)||1;

d.innerHTML='';

for(let i=1;i<=max;i++){
d.innerHTML+=`<option value="${i}">${fa(i)}</option>`;
}

d.value=Math.min(old,max);
}

function fillDate(y,m,d,jy,jm,jd){

y.innerHTML='';

for(let i=jy-2;i<=jy+3;i++){
y.innerHTML+=`<option value="${i}">${fa(i)}</option>`;
}

y.value=jy;

m.innerHTML='';

months.forEach((x,i)=>{
m.innerHTML+=`<option value="${i+1}">${x}</option>`;
});

m.value=jm;

updateDays(y,m,d,jd);

y.onchange=()=>updateDays(y,m,d);
m.onchange=()=>updateDays(y,m,d);
}

function setupDates(){

let t=todayJalali();

fillDate(sYear,sMonth,sDay,...t);
fillDate(eYear,eMonth,eDay,...t);
}

function getDate(prefix){

let y=Number(document.getElementById(prefix+'Year').value);
let m=Number(document.getElementById(prefix+'Month').value);
let d=Number(document.getElementById(prefix+'Day').value);

return isoFromJalali(y,m,d);
}

/* ================= API ================= */

const API_URL='/api/projects';

let projects=[];
let currentTab='pending';
let editingProjectId=null;

function setStatus(t){

statusLine.textContent=t;

setTimeout(()=>{
if(statusLine.textContent===t)statusLine.textContent='';
},2500);
}

async function loadProjects(){

setStatus('در حال دریافت اطلاعات...');

try{

let r=await fetch(API_URL,{
method:'GET',
cache:'no-store'
});

if(!r.ok)throw new Error('خطا در دریافت اطلاعات');

let data=await r.json();

projects=Array.isArray(data)?data:[];

projects.forEach(normalizeProject);

render();

setStatus('اطلاعات دریافت شد');

}catch(e){

console.error(e);

setStatus('خطا در دریافت اطلاعات');

render();
}
}

function normalizeProject(p){

if(!Array.isArray(p.tasks))p.tasks=[];

if(typeof p.note!=='string')p.note='';

p.tasks.forEach(t=>{
if(typeof t.text!=='string')t.text='';
t.done=!!t.done;
});

updateProjectProgress(p);
}

async function saveProjects(){

setStatus('در حال ذخیره...');

try{

let r=await fetch(API_URL,{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(projects)
});

let data={};

try{
data=await r.json();
}catch(e){}

if(!r.ok){
throw new Error(data.error||'خطا در ذخیره‌سازی');
}

setStatus('ذخیره شد');

return true;

}catch(e){

console.error(e);

setStatus('خطا در ذخیره‌سازی');

alert('ذخیره‌سازی انجام نشد:\n'+e.message);

return false;
}
}

/* ================= پروژه ================= */

async function addProject(){

let name=projName.value.trim();

if(!name){
alert('نام پروژه را وارد کنید');
return;
}

let project={
id:Date.now().toString()+Math.random().toString(36).slice(2),
name:name,
start:getDate('s'),
end:getDate('e'),
progress:0,
tasks:[],
note:''
};

projects.unshift(project);

projName.value='';

render();

await saveProjects();
}

async function deleteProject(id){

if(!confirm('این پروژه حذف شود؟'))return;

projects=projects.filter(p=>p.id!==id);

render();

await saveProjects();
}

function updateProjectProgress(p){

if(!p.tasks||p.tasks.length===0){
p.progress=0;
return;
}

let done=p.tasks.filter(x=>x.done).length;

p.progress=Math.round((done/p.tasks.length)*100);
}

function startEditProject(id){
editingProjectId=id;
render();
}

function cancelEditProject(){
editingProjectId=null;
render();
}

function setupEditDates(id,prefix,iso){

let date=jalaliFromIso(iso);

let y=document.getElementById(`edit-${prefix}-y-${id}`);
let m=document.getElementById(`edit-${prefix}-m-${id}`);
let d=document.getElementById(`edit-${prefix}-d-${id}`);

fillDate(y,m,d,...date);
}

function getEditDate(id,prefix){

let y=Number(document.getElementById(`edit-${prefix}-y-${id}`).value);
let m=Number(document.getElementById(`edit-${prefix}-m-${id}`).value);
let d=Number(document.getElementById(`edit-${prefix}-d-${id}`).value);

return isoFromJalali(y,m,d);
}

async function saveEditProject(id){

let p=projects.find(x=>x.id===id);

if(!p)return;

let name=document.getElementById(`edit-name-${id}`).value.trim();

if(!name){
alert('نام پروژه را وارد کنید');
return;
}

p.name=name;
p.start=getEditDate(id,'start');
p.end=getEditDate(id,'end');

editingProjectId=null;

render();

await saveProjects();
}

/* ================= کارها ================= */

async function addTask(id){

let input=document.getElementById('task-'+id);

let text=input.value.trim();

if(!text)return;

let p=projects.find(x=>x.id===id);

p.tasks.push({
text:text,
done:false
});

updateProjectProgress(p);

render();

await saveProjects();
}

async function toggleTask(id,index){

let p=projects.find(x=>x.id===id);

if(!p||!p.tasks[index])return;

p.tasks[index].done=!p.tasks[index].done;

updateProjectProgress(p);

render();

await saveProjects();
}

async function deleteTask(id,index){

let p=projects.find(x=>x.id===id);

if(!p)return;

p.tasks.splice(index,1);

updateProjectProgress(p);

render();

await saveProjects();
}

async function editTask(id,index){

let p=projects.find(x=>x.id===id);

let input=document.getElementById(`task-edit-${id}-${index}`);

let text=input.value.trim();

if(!text)return;

p.tasks[index].text=text;

p.tasks[index].editing=false;

render();

await saveProjects();
}

function startEditTask(id,index){

let p=projects.find(x=>x.id===id);

p.tasks[index].editing=true;

render();
}

function cancelEditTask(id,index){

let p=projects.find(x=>x.id===id);

p.tasks[index].editing=false;

render();
}

/* ================= یادداشت ================= */

async function updateNote(id,value){

let p=projects.find(x=>x.id===id);

if(!p)return;

p.note=value;

await saveProjects();
}

/* ================= هشدار ================= */

function getProjectStatus(p){

if(p.progress>=100){
return{
type:'done',
text:'تکمیل‌شده'
};
}

let today=new Date();

today.setHours(0,0,0,0);

let end=new Date(p.end+'T00:00:00');

let diff=Math.ceil((end-today)/(1000*60*60*24));

if(diff<0){
return{
type:'overdue',
text:'مهلت پروژه گذشته'
};
}

if(diff<=7){
return{
type:'warning',
text:`${fa(diff)} روز تا پایان`
};
}

return{
type:'normal',
text:'در حال انجام'
};
}

/* ================= تب ================= */

function setTab(tab){

currentTab=tab;

['pending','done','all'].forEach(x=>{
document.getElementById('tab-'+x).classList.toggle('active',x===tab);
});

render();
}

function filteredProjects(){

if(currentTab==='pending'){
return projects.filter(p=>p.progress<100);
}

if(currentTab==='done'){
return projects.filter(p=>p.progress>=100);
}

return projects;
}

/* ================= امنیت متن ================= */

function esc(v){

return String(v??'').replace(/[&<>"']/g,x=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[x]));
}

/* ================= نمایش ================= */

function render(){

projects.forEach(normalizeProject);

sumAll.textContent=fa(projects.length);

sumPending.textContent=fa(
projects.filter(p=>p.progress<100).length
);

sumDone.textContent=fa(
projects.filter(p=>p.progress>=100).length
);

let list=filteredProjects();

if(!list.length){
projList.innerHTML='<div class="empty">پروژه‌ای برای نمایش وجود ندارد</div>';
return;
}

projList.innerHTML=list.map(p=>{

let done=p.tasks.filter(t=>t.done).length;

let status=getProjectStatus(p);

let editing=editingProjectId===p.id;

return `

<div class="proj ${status.type==='done'?'complete':''} ${status.type==='warning'?'warning':''} ${status.type==='overdue'?'overdue':''}">

<div class="proj-head">

<div class="proj-name">${esc(p.name)}</div>

<div class="actions">

<button class="icon-btn edit-btn" onclick="startEditProject('${p.id}')">✏️</button>

<button class="icon-btn del-btn" onclick="deleteProject('${p.id}')">✕</button>

</div>

</div>

${editing?`

<div class="edit-box">

<label>نام پروژه</label>

<input id="edit-name-${p.id}" value="${esc(p.name)}">

<label>تاریخ شروع</label>

<div class="date-row">
<select id="edit-start-y-${p.id}"></select>
<select id="edit-start-m-${p.id}"></select>
<select id="edit-start-d-${p.id}"></select>
</div>

<label>تاریخ پایان</label>

<div class="date-row">
<select id="edit-end-y-${p.id}"></select>
<select id="edit-end-m-${p.id}"></select>
<select id="edit-end-d-${p.id}"></select>
</div>

<div class="edit-actions">

<button class="save" onclick="saveEditProject('${p.id}')">💾 ذخیره</button>

<button class="cancel" onclick="cancelEditProject()">لغو</button>

</div>

</div>

`:`

<div class="meta">

<span class="badge ${status.type==='done'?'done':''} ${status.type==='warning'?'warning':''} ${status.type==='overdue'?'overdue':''}">
${status.text}
</span>

<span>📅 شروع: ${formatDate(p.start)}</span>

<span>🏁 پایان: ${formatDate(p.end)}</span>

</div>

`}

<div class="progress-row">

<span>پیشرفت پروژه</span>

<strong>${fa(p.progress)}٪</strong>

</div>

<div class="bar">
<div class="fill" style="width:${p.progress}%"></div>
</div>

<div class="section-title">
✅ کارها (${fa(done)} از ${fa(p.tasks.length)})
</div>

${p.tasks.map((t,i)=>`

<div class="task ${t.done?'done':''}">

<input
type="checkbox"
${t.done?'checked':''}
onchange="toggleTask('${p.id}',${i})">

${t.editing?`

<input
class="task-edit"
id="task-edit-${p.id}-${i}"
value="${esc(t.text)}">

<button class="icon-btn edit-btn" onclick="editTask('${p.id}',${i})">💾</button>

<button class="icon-btn" onclick="cancelEditTask('${p.id}',${i})">↩️</button>

`:`

<span class="task-text">${esc(t.text)}</span>

<button class="icon-btn edit-btn" onclick="startEditTask('${p.id}',${i})">✏️</button>

<button class="icon-btn del-btn" onclick="deleteTask('${p.id}',${i})">✕</button>

`}

</div>

`).join('')}

<div class="subnew">

<input
id="task-${p.id}"
placeholder="کار جدید..."
onkeydown="if(event.key==='Enter')addTask('${p.id}')">

<button onclick="addTask('${p.id}')">افزودن</button>

</div>

<div class="section-title">📝 یادداشت</div>

<div class="note-box">

<textarea
placeholder="یادداشت پروژه..."
onchange="updateNote('${p.id}',this.value)">${esc(p.note)}</textarea>

</div>

</div>

`;

}).join('');

list.forEach(p=>{

if(editingProjectId===p.id){

setupEditDates(p.id,'start',p.start);

setupEditDates(p.id,'end',p.end);

}

});
}

/* ================= گزارش مدیریت ================= */

function openReport(){

let total=projects.length;

let done=projects.filter(p=>p.progress>=100).length;

let pending=total-done;

let avg=total
?Math.round(projects.reduce((s,p)=>s+p.progress,0)/total)
:0;

let html=`

<div class="report-head">

<h2>گزارش وضعیت پروژه‌ها</h2>

<div>تاریخ تهیه گزارش: ${formatDate(todayIso())}</div>

</div>

<div class="report-project">

<strong>خلاصه مدیریتی</strong>

<br>

کل پروژه‌ها: ${fa(total)}

<br>

پروژه‌های تکمیل‌شده: ${fa(done)}

<br>

پروژه‌های در حال انجام: ${fa(pending)}

<br>

میانگین پیشرفت کل: ${fa(avg)}٪

</div>

`;

projects.forEach(p=>{

let status=getProjectStatus(p);

let doneTasks=p.tasks.filter(x=>x.done).length;

html+=`

<div class="report-project">

<h4>📌 ${esc(p.name)}</h4>

<div>
وضعیت: <strong>${status.text}</strong>
</div>

<div>
درصد پیشرفت: <strong>${fa(p.progress)}٪</strong>
</div>

<div>
تاریخ شروع: ${formatDate(p.start)}
</div>

<div>
تاریخ پایان: ${formatDate(p.end)}
</div>

<div>
کارهای انجام‌شده: ${fa(doneTasks)} از ${fa(p.tasks.length)}
</div>

${p.tasks.length?`

<div style="margin-top:8px">

<strong>لیست کارها:</strong>

${p.tasks.map(t=>`
<div>
${t.done?'✅':'⬜'} ${esc(t.text)}
</div>
`).join('')}

</div>

`:''}

${p.note?`

<div style="margin-top:8px">

<strong>یادداشت:</strong>

<br>

${esc(p.note)}

</div>

`:''}

</div>

`;

});

reportContent.innerHTML=html;

reportModal.classList.add('open');
}

function closeReport(){
reportModal.classList.remove('open');
}

function copyReport(){

let text=reportContent.innerText;

navigator.clipboard.writeText(text)
.then(()=>setStatus('گزارش کپی شد'))
.catch(()=>alert('امکان کپی گزارش وجود ندارد'));
}

function todayIso(){

let d=new Date();

return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ================= شروع ================= */

setupDates();

loadProjects();

</script>

</body>
</html>
