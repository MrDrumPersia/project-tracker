<script>
'use strict';
const API='/api/projects';
const ICONS={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',today:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 5 2 2 4-4"/>',board:'<rect x="3" y="3" width="7" height="18" rx="2"/><rect x="14" y="3" width="7" height="11" rx="2"/>',projects:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 4V2"/>',repeat:'<path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/>',chart:'<path d="M3 3v18h18M7 16v-4m5 4V7m5 9V9"/>',history:'<path d="M3 12a9 9 0 1 0 3-7M3 3v5h5M12 7v5l3 2"/>',plus:'<path d="M12 5v14m-7-7h14"/>',chev:'<path d="m15 18-6-6 6-6"/>',search:'<circle cx="10" cy="10" r="7"/><path d="m15.5 15.5 5 5"/>',flag:'<path d="M5 21V4m0 0h14l-3 5 3 5H5"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',layers:'<path d="m12 2 9 5-9 5-9-5 9-5zm-9 10 9 5 9-5M3 17l9 5 9-5"/>',edit:'<path d="M12 20h9M16 3l5 5-12 12H4v-5L16 3z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6m4-6v6"/>',save:'<path d="M4 3h13l4 4v14H3V3zM7 3v7h10V3M7 21v-8h10v8"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',spark:'<path d="m12 2 2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2L12 2z"/>',filter:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>',restore:'<path d="M3 11a9 9 0 1 1 3 7M3 3v8h8"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 10v6m0-9h.01"/>'};
function icon(n){return `<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||ICONS.layers}</svg>`}
const VIEWS=[['overview','home','نمای کلی'],['today','today','امروز من'],['board','board','برد کانبان'],['projects','projects','پروژه‌ها'],['recurring','repeat','کارهای تکراری'],['reports','chart','گزارش‌ها'],['history','history','تاریخچه']];
const state={view:'overview',projects:[],loaded:false,saving:false,sha:null,filters:'all',search:'',error:'',sync:'loading',demo:false};
function h(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localIso(date=new Date()){const d=new Date(date.getTime()-date.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)}
function gregorianToJalali(gy,gm,gd){

let g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
let jy=gy<=1600?0:979;

gy-=gy<=1600?621:1600;

let gy2=gm>2?gy+1:gy;

let days=
365*gy+
Math.floor((gy2+3)/4)-
Math.floor((gy2+99)/100)+
Math.floor((gy2+399)/400)-
80+gd+g_d_m[gm-1];

jy+=33*Math.floor(days/12053);
days%=12053;

jy+=4*Math.floor(days/1461);
days%=1461;

if(days>365){
jy+=Math.floor((days-1)/365);
days=(days-1)%365;
}

let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);
let jd=1+(days<186?days%31:(days-186)%30);

return[jy,jm,jd];
}

function jalaliToGregorian(jy,jm,jd){

let gy=jy<=979?621:1600;

jy-=jy<=979?0:979;

let days=
365*jy+
Math.floor(jy/33)*8+
Math.floor(((jy%33)+3)/4)+
78+jd+
(jm<7?(jm-1)*31:(jm-7)*30+186);

gy+=400*Math.floor(days/146097);
days%=146097;

if(days>36524){
gy+=100*Math.floor(--days/36524);
days%=36524;
if(days>=365)days++;
}

gy+=4*Math.floor(days/1461);
days%=1461;

if(days>365){
gy+=Math.floor((days-1)/365);
days=(days-1)%365;
}

let gd=days+1;

let sal=[
0,31,
((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28,
31,30,31,30,31,31,30,31,30,31
];

let gm;

for(gm=1;gm<13;gm++){
if(gd<=sal[gm])break;
gd-=sal[gm];
}

return[gy,gm,gd];
}

function todayJalali(){
let d=new Date();
return gregorianToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
}

function isoFromJalali(y,m,d){
let r=jalaliToGregorian(y,m,d);
return `${r[0]}-${String(r[1]).padStart(2,'0')}-${String(r[2]).padStart(2,'0')}`;
}

function jalaliFromIso(iso){
if(!iso)return todayJalali();
let p=iso.split('-').map(Number);
return gregorianToJalali(p[0],p[1],p[2]);
}


function asDate(iso){return iso?new Date(`${iso}T12:00:00`):null}
function fmt(iso){if(!iso)return 'بدون تاریخ';try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'short',day:'numeric'}).format(asDate(iso))}catch{return iso}}
function fmtShort(iso){if(!iso)return '—';return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'short',day:'numeric'}).format(asDate(iso))}
function today(){return localIso()}
function addDays(iso,n){const d=new Date(`${iso}T12:00:00Z`);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function nextOccurrence(iso,freq,anchor){if(freq==='daily')return addDays(iso,1);if(freq==='weekly')return addDays(iso,7);const [y,m]=iso.split('-').map(Number);const target=new Date(Date.UTC(y,m,1,12));const year=target.getUTCFullYear(),month=target.getUTCMonth()+1;const last=new Date(Date.UTC(year,month,0)).getUTCDate();return `${year}-${String(month).padStart(2,'0')}-${String(Math.min(anchor||Number(iso.slice(8,10)),last)).padStart(2,'0')}`}
function uid(){return 'v3-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function activeP(){return state.projects.filter(p=>!p.archived)}
function activeT(p){return (p.tasks||[]).map((t,i)=>({...t,_i:i})).filter(t=>!t.deletedAt)}
function status(t){return t.done?'done':t.status==='doing'?'doing':'todo'}
function pri(t){return ['low','normal','high','urgent'].includes(t.priority)?t.priority:'normal'}
function priName(v){return ({urgent:'فوری',high:'بالا',normal:'عادی',low:'کم'})[v]||'عادی'}
function priorityBadge(t){return `<span class="prio ${pri(t)}">● ${priName(pri(t))}</span>`}
function allTasks(){return activeP().flatMap(p=>activeT(p).map(t=>({p,t}))) }
function counts(){const ps=activeP(),ts=allTasks();return {ps,ts,open:ts.filter(x=>!x.t.done),done:ts.filter(x=>x.t.done),overdue:ts.filter(x=>!x.t.done&&x.t.due&&x.t.due<today()),due:ts.filter(x=>!x.t.done&&x.t.due&&x.t.due<=today()),routines:ps.reduce((n,p)=>n+(p.recurring||[]).filter(r=>r.enabled!==false).length,0)}}
function isOverdue(p){return p.end&&p.end<today()&&p.progress<100}
function progress(p){let ts=activeT(p);return ts.length?Math.round(100*ts.filter(t=>t.done).length/ts.length):(Number(p.progress)||0)}
function recalc(p){const ts=activeT(p);p.progress=ts.length?Math.round(100*ts.filter(t=>t.done).length/ts.length):0}
function snapshot(p){const {history,...rest}=p;return JSON.parse(JSON.stringify(rest))}
function ensure(p){p.tasks=Array.isArray(p.tasks)?p.tasks:[];p.recurring=Array.isArray(p.recurring)?p.recurring:[];p.history=Array.isArray(p.history)?p.history:[]}
function writeHistory(p,label,before,type='edit'){ensure(p);p.history.unshift({id:uid(),at:new Date().toISOString(),label,before,type});p.history=p.history.slice(0,25);p.updatedAt=new Date().toISOString()}
function setSync(s){state.sync=s;const e=document.querySelector('#syncBadge');if(!e)return;e.classList.toggle('bad',s==='error'||s==='conflict');e.querySelector('span').textContent=({loading:'در حال دریافت...',ready:'ذخیره‌شده',saving:'در حال ذخیره...',error:'خطا در اتصال',conflict:'تداخل تغییرات'})[s]||'متصل'}
function toast(msg,bad=false){const root=document.querySelector('#toastRoot');root.innerHTML=`<div class="toast ${bad?'bad':''}" role="status">${h(msg)}</div>`;setTimeout(()=>{if(root)root.innerHTML=''},4200)}
function banner(){let msg=state.error;document.querySelector('#banner').innerHTML=msg?`<div class="banner" role="alert"><strong>نیاز به توجه</strong>${h(msg)} <button class="btn secondary small" data-action="reload" style="margin-right:10px">تلاش دوباره</button></div>`:''}
async function load(){state.sync='loading';setSync('loading');state.error='';banner();try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw Error(`خطای دریافت اطلاعات (${r.status})`);const x=await r.json();if(!Array.isArray(x))throw Error('ساختار پروژه‌ها معتبر نیست');state.projects=x;state.sha=r.headers.get('X-Data-Sha');state.loaded=true;setSync('ready');render()}catch(e){state.loaded=false;state.error='داده‌ها از سرور دریافت نشدند. برای جلوگیری از حذف اطلاعات، امکان ویرایش تا برقراری اتصال غیرفعال است. '+(e.message||'');setSync('error');render()}}
async function commit(change,success='تغییرات ذخیره شد'){if(!state.loaded||state.saving){toast('تا پایان ذخیره‌سازی صبر کنید یا اتصال را بررسی کنید.',true);return false}const copy=JSON.parse(JSON.stringify(state.projects));try{change(copy)}catch(e){toast(e.message||'ورودی نامعتبر',true);return false}state.saving=true;setSync('saving');try{const headers={'Content-Type':'application/json'};if(state.sha)headers['X-Expected-Sha']=state.sha;const r=await fetch(API,{method:'POST',headers,body:JSON.stringify(copy)});const result=await r.json().catch(()=>({}));if(!r.ok){if(r.status===409){state.error='فایل پروژه‌ها از دستگاه یا نشست دیگری تغییر کرده است. برای جلوگیری از بازنویسی اطلاعات، هیچ تغییری ثبت نشد؛ صفحه را دوباره بارگیری کنید.';setSync('conflict')}throw Error(result.error||`خطای ذخیره ${r.status}`)}state.projects=copy;if(result.sha)state.sha=result.sha;else state.sha=null;state.error='';setSync('ready');toast(success);render();return true}catch(e){state.error=state.error||`تغییرات جدید ذخیره نشدند و نسخه قبلی حفظ شد: ${e.message}`;setSync('error');banner();toast(e.message||'خطای ذخیره‌سازی',true);return false}finally{state.saving=false}}
function update(pid,label,change,type='edit'){return commit(arr=>{const p=arr.find(x=>x.id===pid);if(!p)throw Error('پروژه پیدا نشد');ensure(p);const prev=snapshot(p);change(p);recalc(p);writeHistory(p,label,prev,type)},label)}
function projectById(id){return state.projects.find(p=>p.id===id)}
function refs(){document.querySelector('#datePill').innerHTML=icon('today')+' '+fmt(today());const n=counts();const choices=VIEWS.map(([k,i,title])=>`<button class="navbutton ${state.view===k?'active':''}" data-view="${k}">${icon(i)}<span>${title}</span>${k==='today'&&n.due.length?`<span class="navcount">${n.due.length}</span>`:''}</button>`).join('');document.querySelector('#desktopNav').innerHTML=choices;const mobile=VIEWS.filter(v=>['overview','today','board','projects','reports'].includes(v[0]));document.querySelector('#mobileNav').innerHTML=mobile.map(([k,i,title])=>`<button class="${state.view===k?'active':''}" data-view="${k}">${icon(i)}<span>${title}</span></button>`).join('')+`<button data-action="more-menu" class="${['recurring','history'].includes(state.view)?'active':''}">${icon('layers')}<span>بیشتر</span></button>`;
 document.querySelector('#morePanel').innerHTML=VIEWS.filter(v=>['recurring','history'].includes(v[0])).map(([k,i,title])=>`<button data-view="${k}">${icon(i)} ${title}</button>`).join('');const title=({overview:'داشبورد پروژه‌ها',today:'امروز من',board:'برد کانبان',projects:'همه پروژه‌ها',recurring:'کارهای تکرارشونده',reports:'گزارش‌های پیشرفته',history:'تاریخچه و بازیابی'})[state.view];document.querySelector('#pageTitle').textContent=title;document.querySelector('#crumb').textContent=title;banner()}
function stat(label,num,desc,i,clr){return `<div class="glass stat" style="--accent:${clr}"><div class="stathead"><span>${label}</span><span class="stat-icon">${icon(i)}</span></div><strong>${num.toLocaleString('fa-IR')}</strong><small>${desc}</small></div>`}
function stats(){const n=counts();return `<div class="stats">${stat('پروژه‌های فعال',n.ps.length,'تکمیل‌شده و در جریان','layers','#aca0ff')}${stat('وظایف باز',n.open.length,'کارهای باقی‌مانده','board','#84c0ff')}${stat('سررسید گذشته',n.overdue.length,'نیازمند پیگیری','flag','#ff9aaf')}${stat('وظایف انجام‌شده',n.done.length,'از مجموع کارهای فعلی','check','#75edd6')}</div>`}
function taskRow(x){const {p,t}=x;return `<div class="taskline ${t.done?'completed':''}"><button class="mini-check ${t.done?'isdone':''}" title="تغییر وضعیت" data-action="toggle-task" data-pid="${h(p.id)}" data-i="${t._i}">${icon('check')}</button><div class="taskbody"><strong>${h(t.text||'بدون عنوان')}</strong><small>${h(p.name)} · ${t.due?'سررسید '+fmt(t.due):'بدون سررسید'}${status(t)==='doing'?' · در حال انجام':''}</small></div>${priorityBadge(t)}<button class="btn secondary icononly small" title="ویرایش وظیفه" data-action="edit-task" data-pid="${h(p.id)}" data-i="${t._i}">${icon('edit')}</button></div>`}
function projectCard(p){const pct=progress(p),count=activeT(p).length,done=activeT(p).filter(t=>t.done).length;const completed=pct===100&&count>0;return `<article class="glass projectcard"><div class="projecttop"><div><div class="tagline">${icon('layers')} پروژه</div><h3>${h(p.name||'بدون نام')}</h3></div><span class="pill ${completed?'ok':isOverdue(p)?'late':'run'}">${completed?'تکمیل‌شده':isOverdue(p)?'عقب‌افتاده':'در جریان'}</span></div><div class="projectmeta"><span>${icon('today')} ${fmtShort(p.start)} تا ${fmtShort(p.end)}</span><span>${done.toLocaleString('fa-IR')} از ${count.toLocaleString('fa-IR')} کار</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="projectbottom"><b>${pct.toLocaleString('fa-IR')}٪ پیشرفت</b><button class="btn ghost small" data-action="project-detail" data-pid="${h(p.id)}">جزئیات ${icon('chev')}</button></div></article>`}
function empty(t,sub){return `<div class="empty"><span class="empty-icon">✦</span><h3>${h(t)}</h3><p>${h(sub)}</p></div>`}
function overview(){const n=counts();const ordered=n.open.filter(x=>x.t.due&&x.t.due<=today()).sort(sortTasks).slice(0,4);const fallback=n.open.filter(x=>!x.t.due).sort(sortTasks).slice(0,4);const focus=ordered.length?ordered:fallback;const ps=n.ps.slice().sort((a,b)=>Number(isOverdue(b))-Number(isOverdue(a))||a.progress-b.progress).slice(0,4);return `<div class="hero"><div class="hero-copy"><span class="tagline">${icon('spark')} WORKSPACE · V3</span><h2>امروز رو <em>هوشمندانه</em><br> جلو ببر.</h2><p>همه پروژه‌ها، وظایف فوری و گزارش پیشرفت در یک فضای کاری شیشه‌ای و منظم کنار هم قرار گرفته‌اند.</p><div class="wrapflex"><button class="btn primary" data-view="today">${icon('today')} برنامه امروز</button><button class="btn secondary" data-view="board">${icon('board')} برد کارها</button></div></div><div class="hero-art"><div class="orbit"></div><div class="orbit o2"></div><div class="artback"></div><div class="artfront"><div class="artline"></div><div class="artline"></div><div class="artline"></div><div class="artcheck">✓</div></div><div class="artbubble">✦</div></div></div>${stats()}<div class="grid2"><section class="glass contentcard"><div class="sectionhead"><div><span class="tagline">FOCUS</span><h2>اولویت‌های امروز</h2><p>${ordered.length?'کارهایی که موعدشان رسیده یا گذشته است':'کارهای بدون سررسید برای برنامه‌ریزی'}</p></div><button class="btn secondary small" data-view="today">نمایش همه ${icon('chev')}</button></div><div class="quicklist">${focus.length?focus.map(taskRow).join(''):empty('کاری برای نمایش نیست','از بخش پروژه‌ها، وظیفه جدید اضافه کنید.')}</div></section><section class="glass contentcard"><div class="sectionhead"><div><span class="tagline">INSIGHTS</span><h2>نبض عملکرد</h2><p>آمار زنده از وضعیت فعلی</p></div></div><div class="insight"><div class="insightitem"><span>تکمیل وظایف</span><strong>${n.ts.length?Math.round(n.done.length/n.ts.length*100):0}٪</strong></div><div class="insightitem"><span>موعد امروز</span><strong>${n.due.filter(x=>x.t.due===today()).length.toLocaleString('fa-IR')}</strong></div><div class="insightitem"><span>پروژه‌های دیرکرد</span><strong>${n.ps.filter(isOverdue).length.toLocaleString('fa-IR')}</strong></div><div class="insightitem"><span>برنامه‌های تکراری</span><strong>${n.routines.toLocaleString('fa-IR')}</strong></div></div><div class="spacer20"></div><button class="btn ghost" style="width:100%" data-view="reports">مشاهده گزارش کامل ${icon('chart')}</button></section></div><div class="spacer20"></div><div class="sectionhead"><div><h2>پروژه‌های اخیر</h2><p>دسترسی سریع به جزئیات و وظایف</p></div><button class="btn secondary small" data-view="projects">همه پروژه‌ها ${icon('chev')}</button></div><div class="projectgrid">${ps.map(projectCard).join('')||empty('پروژه‌ای ثبت نشده','اولین پروژه خود را ایجاد کنید.')}</div>`}
function sortTasks(a,b){const ao=a.t.due||'9999',bo=b.t.due||'9999';return (ao<bo?-1:ao>bo?1:0)||(['urgent','high','normal','low'].indexOf(pri(a.t))-['urgent','high','normal','low'].indexOf(pri(b.t)))}
function todayView(){const tasks=allTasks().filter(x=>!x.t.done);const due=tasks.filter(x=>x.t.due&&x.t.due<=today()).sort(sortTasks);const unscheduled=tasks.filter(x=>!x.t.due).sort(sortTasks).slice(0,8);const upcoming=tasks.filter(x=>x.t.due&&x.t.due>today()).sort(sortTasks).slice(0,6);const overdue=due.filter(x=>x.t.due<today()).length;return `<div class="hero" style="min-height:190px"><div class="hero-copy"><span class="tagline">${icon('today')} DAILY FOCUS</span><h2>برنامه <em>امروز من</em></h2><p>${fmt(today())} · ${overdue.toLocaleString('fa-IR')} وظیفه عقب‌افتاده و ${(due.length-overdue).toLocaleString('fa-IR')} وظیفه امروز برای رسیدگی داری.</p></div><div class="hero-art" style="height:160px;opacity:.5"><div class="orbit"></div><div class="artfront"><div class="artline"></div><div class="artline"></div></div></div></div><div class="grid2"><section class="glass contentcard"><div class="sectionhead"><div><span class="tagline">DEADLINE</span><h2>سررسید امروز و معوق</h2><p>با تکمیل هر کار، فهرست به‌روز می‌شود.</p></div><span class="pill late">${due.length.toLocaleString('fa-IR')} کار</span></div><div class="quicklist">${due.length?due.map(taskRow).join(''):empty('کار دارای سررسید ندارید','برای وظایف، تاریخ سررسید تعیین کنید.')}</div></section><section class="glass contentcard"><div class="sectionhead"><div><span class="tagline">PLAN AHEAD</span><h2>در صف برنامه‌ریزی</h2><p>کارهای بدون تاریخ را به امروز اضافه کن</p></div></div><div class="quicklist">${unscheduled.length?unscheduled.map(({p,t})=>`<div class="taskline"><div class="taskbody"><strong>${h(t.text)}</strong><small>${h(p.name)}</small></div><button class="btn ghost small" data-action="schedule-today" data-pid="${h(p.id)}" data-i="${t._i}">برای امروز ＋</button></div>`).join(''):empty('همه کارها برنامه دارند','کار بدون سررسید پیدا نشد.')}</div></section></div><div class="spacer20"></div><section class="glass contentcard"><div class="sectionhead"><div><h2>موعدهای بعدی</h2><p>نگاهی به وظایف پیش رو</p></div></div><div class="quicklist">${upcoming.length?upcoming.map(taskRow).join(''):empty('فعلاً موعد دیگری نیست','می‌توانی تاریخ سررسید کارهای آینده را مشخص کنی.')}</div></section>`}
function kanCard(x){const {p,t}=x;return `<article class="kan-card" draggable="true" data-drag-pid="${h(p.id)}" data-drag-i="${t._i}"><div class="rowbetween">${priorityBadge(t)}<span class="pill">${t.due?fmtShort(t.due):'بدون موعد'}</span></div><h4>${h(t.text||'بدون عنوان')}</h4><small>${icon('layers')} ${h(p.name)}</small><div class="kan-card-footer"><button class="btn secondary small" data-action="edit-task" data-pid="${h(p.id)}" data-i="${t._i}">${icon('edit')} ویرایش</button><select aria-label="تغییر وضعیت" data-action="task-status" data-pid="${h(p.id)}" data-i="${t._i}"><option value="todo" ${status(t)==='todo'?'selected':''}>باید انجام شود</option><option value="doing" ${status(t)==='doing'?'selected':''}>در حال انجام</option><option value="done" ${status(t)==='done'?'selected':''}>انجام‌شده</option></select></div></article>`}
function boardView(){const ts=allTasks();const cols=[['todo','برای انجام','●','#a99fff'],['doing','در حال انجام','◉','#ffcc89'],['done','تکمیل‌شده','✓','#70efd1']];return `<div class="sectionhead"><div><span class="tagline">KANBAN BOARD</span><h2>برد مدیریت وظایف</h2><p>کارت‌ها را بین ستون‌ها بکش یا از منوی وضعیت استفاده کن (برای موبایل).</p></div><button class="btn secondary" data-action="new-task">${icon('plus')} وظیفه جدید</button></div><div class="kanban">${cols.map(([k,name,sym,color])=>{const list=ts.filter(x=>status(x.t)===k).sort(sortTasks);return `<section class="kan-col" data-drop="${k}"><div class="kan-head"><strong style="color:${color}">${sym} ${name}</strong><span>${list.length.toLocaleString('fa-IR')}</span></div><div class="kan-stack">${list.map(kanCard).join('')||empty('ستون خالی است','کارت‌ها را به این قسمت منتقل کنید.')}</div></section>`}).join('')}</div>`}
function projectsView(){let ps=activeP();if(state.filters==='pending')ps=ps.filter(p=>progress(p)<100);if(state.filters==='completed')ps=ps.filter(p=>progress(p)===100);if(state.filters==='late')ps=ps.filter(isOverdue);if(state.search.trim())ps=ps.filter(p=>(p.name+' '+p.note+' '+activeT(p).map(t=>t.text).join(' ')).toLocaleLowerCase('fa').includes(state.search.toLocaleLowerCase('fa')));const filters=[['all','همه'],['pending','در جریان'],['completed','تکمیل‌شده'],['late','عقب‌افتاده']];return `<div class="toolbar"><div class="search">${icon('search')}<input id="projectSearch" placeholder="جستجو در پروژه‌ها و وظایف..." value="${h(state.search)}" autocomplete="off"/></div><div class="filters">${filters.map(([k,v])=>`<button data-filter="${k}" class="filter ${k===state.filters?'active':''}">${v}</button>`).join('')}</div></div><div class="sectionhead"><div><h2>لیست پروژه‌ها</h2><p>${ps.length.toLocaleString('fa-IR')} پروژه در این نما</p></div></div><div class="projectgrid" id="filteredProjects">${ps.map(projectCard).join('')||empty('موردی پیدا نشد','فیلتر یا عبارت جستجو را تغییر بده.')}</div>`}
function recurringView(){const list=activeP().flatMap(p=>(p.recurring||[]).map(r=>({p,r})));const upcoming=list.filter(x=>x.r.enabled!==false&&x.r.nextDate<=today());const freq={'daily':'هر روز','weekly':'هر هفته','monthly':'هر ماه'};return `<div class="hero" style="min-height:206px"><div class="hero-copy"><span class="tagline">${icon('repeat')} ROUTINES</span><h2>کارهای <em>تکرارشونده</em></h2><p>برنامه‌های دوره‌ای را یک بار تعریف کن و نوبت‌های سررسید را با یک کلیک بساز. برای اجرا نیازی به زمان‌بند Vercel نیست.</p><div class="wrapflex"><button class="btn primary" data-action="run-recurring">${icon('repeat')} ایجاد نوبت‌های سررسید (${upcoming.length.toLocaleString('fa-IR')})</button><button class="btn secondary" data-action="new-recurring">${icon('plus')} برنامه جدید</button></div></div><div class="hero-art" style="opacity:.64;transform:scale(.8)"><div class="orbit"></div><div class="artfront"><div class="artline"></div><div class="artline"></div><div class="artcheck">↻</div></div></div></div><div class="notice">ایجاد وظایف تکراری فقط هنگام انتخاب «ایجاد نوبت‌های سررسید» انجام می‌شود؛ برنامه در پس‌زمینه یا وقتی بسته است اجرا نمی‌شود. هر بار حداکثر ۳۰ نوبت برای هر برنامه ایجاد می‌شود و نوبت تکراری ساخته نخواهد شد.</div><div class="sectionhead"><div><h2>برنامه‌های ثبت‌شده</h2><p>${list.length.toLocaleString('fa-IR')} برنامه تکرار</p></div></div><div class="recgrid">${list.map(({p,r})=>`<article class="glass routine-card"><div class="rowbetween"><span class="tagline">${freq[r.freq]||'دوره‌ای'}</span><span class="pill ${r.enabled===false?'late':'ok'}">${r.enabled===false?'متوقف':'فعال'}</span></div><h3>${h(r.text)}</h3><small>${h(p.name)} · نوبت بعدی: ${fmt(r.nextDate)}</small><div class="routine-footer">${priorityBadge(r)}<div class="wrapflex"><button class="btn secondary small" data-action="toggle-recurring" data-pid="${h(p.id)}" data-rid="${h(r.id)}">${r.enabled===false?'فعال‌سازی':'توقف'}</button><button class="btn danger small" data-action="delete-recurring" data-pid="${h(p.id)}" data-rid="${h(r.id)}">حذف</button></div></div></article>`).join('')||empty('هنوز برنامه‌ای تعریف نشده','با گزینه «برنامه جدید» کار تکراری بساز.')}</div>`}
function reportsView(){const n=counts();const ratio=n.ts.length?Math.round(n.done.length/n.ts.length*100):0;const days=Array.from({length:7},(_,i)=>addDays(today(),i-6));const recent=n.done.filter(x=>x.t.completedAt);const series=days.map(d=>recent.filter(x=>x.t.completedAt.slice(0,10)===d).length);const max=Math.max(1,...series);const buckets={urgent:0,high:0,normal:0,low:0};n.open.forEach(x=>buckets[pri(x.t)]++);const top=n.ps.slice().sort((a,b)=>progress(b)-progress(a)).slice(0,7);return `<div class="toolbar"><div><span class="tagline">ANALYTICS</span><h2 style="font-size:22px;margin:4px 0">گزارش‌های پیشرفته</h2><p class="muted" style="margin:0">آمار فعلی پروژه‌ها، اولویت‌ها و روند تکمیل کار</p></div><div class="wrapflex"><button class="btn secondary" data-action="export-csv">${icon('download')} خروجی CSV</button><button class="btn ghost" data-action="print-report">گزارش چاپی / PDF</button></div></div>${stats()}<div class="reportgrid"><section class="glass contentcard"><div class="sectionhead"><div><h2>فعالیت ۷ روز اخیر</h2><p>وظایفی که زمان تکمیل آن‌ها در نسخه V3 ثبت شده است</p></div></div><div class="bars">${days.map((d,i)=>`<div class="barcol"><span class="barvalue">${series[i].toLocaleString('fa-IR')}</span><div class="barheight" style="height:${Math.max(4,series[i]/max*153)}px"></div><span class="barlabel">${fmtShort(d)}</span></div>`).join('')}</div></section><section class="glass contentcard"><div class="sectionhead"><div><h2>نرخ تکمیل</h2><p>کل وظایف موجود</p></div></div><div class="donut" style="--pct:${ratio}"><div class="donut-inner"><strong>${ratio.toLocaleString('fa-IR')}٪</strong><small>انجام شده</small></div></div><div class="reportrow"><span>انجام‌شده</span><strong>${n.done.length.toLocaleString('fa-IR')}</strong></div><div class="reportrow"><span>باقی‌مانده</span><strong>${n.open.length.toLocaleString('fa-IR')}</strong></div></section></div><div class="spacer20"></div><div class="reportgrid"><section class="glass contentcard"><div class="sectionhead"><div><h2>پیشرفت پروژه‌ها</h2><p>۷ پروژه با بیشترین درصد انجام</p></div></div>${top.map(p=>`<div style="margin:13px 0"><div class="rowbetween"><strong style="font-size:11px">${h(p.name)}</strong><span class="muted">${progress(p).toLocaleString('fa-IR')}٪</span></div><div class="progress" style="margin-top:7px"><span style="width:${progress(p)}%"></span></div></div>`).join('')||empty('هنوز پروژه‌ای ثبت نشده','ابتدا پروژه بسازید.')}</section><section class="glass contentcard"><div class="sectionhead"><div><h2>وظایف باز بر اساس اولویت</h2><p>برای تصمیم‌گیری بهتر</p></div></div>${Object.entries(buckets).map(([k,v])=>`<div class="reportrow"><span>${priorityBadge({priority:k})}</span><strong>${v.toLocaleString('fa-IR')}</strong></div>`).join('')}<div class="notice" style="margin:15px 0 0">آمار تاریخی قبل از ثبت زمان تکمیل قابل بازسازی نیست؛ نمودار فعالیت، کارهای تکمیل‌شده قدیمی را شامل نمی‌شود.</div></section></div>`}
function historyView(){const items=state.projects.flatMap(p=>(p.history||[]).map(e=>({p,e}))).sort((a,b)=>b.e.at.localeCompare(a.e.at)).slice(0,100);const archived=state.projects.filter(p=>p.archived);return `<div class="toolbar"><div><span class="tagline">AUDIT & RECOVERY</span><h2 style="font-size:22px;margin:4px 0">تاریخچه و بازیابی</h2><p class="muted" style="margin:0">تغییرات اخیر، پروژه‌های بایگانی‌شده و نسخه پشتیبان</p></div><button class="btn primary" data-action="export-backup">${icon('download')} دانلود نسخه پشتیبان JSON</button></div><div class="notice">برای هر پروژه حداکثر ۲۵ رویداد اخیر نگهداری می‌شود. «بازگرداندن» فقط همان پروژه را به وضعیت پیش از رویداد انتخابی برمی‌گرداند و یک رویداد جدید ثبت می‌کند. اطلاعات قدیمی، قبل از نصب V3، تاریخچه قابل بازیابی ندارند.</div>${archived.length?`<section class="glass contentcard" style="margin-bottom:18px"><div class="sectionhead"><div><h2>پروژه‌های بایگانی‌شده</h2><p>امکان بازگردانی بدون حذف داده‌ها</p></div></div><div class="quicklist">${archived.map(p=>`<div class="taskline"><div class="taskbody"><strong>${h(p.name)}</strong><small>${activeT(p).length} وظیفه</small></div><button class="btn ghost small" data-action="unarchive" data-pid="${h(p.id)}">${icon('restore')} بازگردانی</button></div>`).join('')}</div></section>`:''}<div class="sectionhead"><div><h2>رویدادهای اخیر</h2><p>${items.length.toLocaleString('fa-IR')} رویداد نمایش داده شده</p></div></div><div class="timeline">${items.map(({p,e})=>`<div class="glass event"><div class="eventicon">${icon(e.type==='restore'?'restore':'history')}</div><div class="eventbody"><strong>${h(e.label||'تغییر پروژه')}</strong><p>${h(p.name)}</p><small>${new Date(e.at).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'})}</small></div>${e.before?`<div class="eventaction"><button class="btn ghost small" data-action="restore-event" data-pid="${h(p.id)}" data-eid="${h(e.id)}">${icon('restore')} بازگردانی این نسخه</button></div>`:''}</div>`).join('')||empty('هنوز رویدادی ثبت نشده','تغییرات جدید بعد از راه‌اندازی V3 اینجا نمایش داده می‌شوند.')}</div>`}
function render(){refs();if(!state.loaded){document.querySelector('#stage').innerHTML=empty('داده‌ها در دسترس نیستند','برای دریافت پروژه‌ها، اتصال GitHub/Vercel را بررسی و دوباره تلاش کنید.');return}document.querySelector('#stage').innerHTML=({overview,today:todayView,board:boardView,projects:projectsView,recurring:recurringView,reports:reportsView,history:historyView})[state.view]();}
function go(k){document.querySelector('#morePanel').classList.add('hidden');state.view=k;state.search='';state.filters='all';render();window.scrollTo({top:0,behavior:'smooth'})}
function openModal(title,body,wide=false){const root=document.querySelector('#modalRoot');root.innerHTML=`<div class="modalshade" data-action="shade"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${h(title)}"><div class="modalheader"><div><span class="tagline">PROJECT TRACKER V3</span><h2>${h(title)}</h2></div><button class="btn secondary icononly" data-action="close-modal" title="بستن">${icon('close')}</button></div>${body}</div></div>`;root.querySelectorAll('.jalali-field').forEach(updateJalaliField);root.querySelector('.modal input:not([type=hidden]),.modal textarea,.modal select,.modal button')?.focus()}
function closeModal(){document.querySelector('#modalRoot').innerHTML=''}
function formInput(name,label,value='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${h(value)}" ${extra}/></div>`}
function formSelect(name,label,opts,val){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${opts.map(([k,v])=>`<option value="${k}" ${val===k?'selected':''}>${v}</option>`).join('')}</select></div>`}
const JMONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jalaliField(name,label,iso,optional=false){
 const base=iso||today(),[jy,jm,jd]=jalaliFromIso(base);const years=Array.from({length:15},(_,i)=>jy-7+i);
 return `<div class="field jalali-field"><label>${label} (شمسی)</label><div class="jalali-parts"><select data-date-part="year" aria-label="سال">${years.map(y=>`<option value="${y}" ${y===jy?'selected':''}>${y.toLocaleString('fa-IR')}</option>`).join('')}</select><select data-date-part="month" aria-label="ماه">${JMONTHS.map((v,i)=>`<option value="${i+1}" ${jm===i+1?'selected':''}>${v}</option>`).join('')}</select><select data-date-part="day" aria-label="روز">${Array.from({length:maxJDays(jy,jm)},(_,i)=>`<option value="${i+1}" ${jd===i+1?'selected':''}>${(i+1).toLocaleString('fa-IR')}</option>`).join('')}</select></div><input type="hidden" name="${name}" value="${h(iso||'')}" data-iso="1"/>${optional?`<label class="jalali-none"><input type="checkbox" data-no-date="1" ${!iso?'checked':''}/> بدون سررسید</label>`:''}</div>`
}
function maxJDays(y,m){if(m<=6)return 31;if(m<=11)return 30;const z=jalaliToGregorian(y,12,30);const back=gregorianToJalali(...z);return back[0]===y&&back[1]===12&&back[2]===30?30:29}
function updateJalaliField(box){const y=Number(box.querySelector('[data-date-part="year"]').value),m=Number(box.querySelector('[data-date-part="month"]').value),d=box.querySelector('[data-date-part="day"]'),chosen=Number(d.value)||1,max=maxJDays(y,m);d.innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}">${(i+1).toLocaleString('fa-IR')}</option>`).join('');d.value=String(Math.min(chosen,max));const off=box.querySelector('[data-no-date]')?.checked||false;box.querySelectorAll('[data-date-part]').forEach(el=>el.disabled=off);box.querySelector('[data-iso]').value=off?'':isoFromJalali(y,m,Number(d.value));}
const PRIS=[['normal','عادی'],['low','پایین'],['high','بالا'],['urgent','فوری']];const STAT=[['todo','برای انجام'],['doing','در حال انجام'],['done','تکمیل‌شده']];const FREQ=[['none','بدون تکرار'],['daily','روزانه'],['weekly','هفتگی'],['monthly','ماهانه']];
function projectForm(p){const edit=!!p;openModal(edit?'ویرایش پروژه':'پروژه جدید',`<form data-form="project" data-pid="${h(p?.id||'')}">${formInput('name','نام پروژه',p?.name||'','text','required maxlength="180"')}<div class="formgrid">${jalaliField('start','تاریخ شروع',p?.start||today())}${jalaliField('end','تاریخ پایان',p?.end||today())}</div><div class="field"><label>یادداشت پروژه</label><textarea name="note">${h(p?.note||'')}</textarea></div><div class="modalactions"><button type="button" class="btn secondary" data-action="close-modal">انصراف</button><button type="submit" class="btn primary">${icon('save')} ${edit?'ذخیره تغییرات':'ایجاد پروژه'}</button></div></form>`)}
function chooseProject(){const ps=activeP();if(!ps.length)return toast('ابتدا یک پروژه جدید بسازید.',true);openModal('انتخاب پروژه برای وظیفه',`<div class="quicklist">${ps.map(p=>`<button class="btn secondary" style="justify-content:space-between;text-align:right" data-action="task-for-project" data-pid="${h(p.id)}">${h(p.name)} ${icon('chev')}</button>`).join('')}</div>`)}
function taskForm(pid,i=null){const p=projectById(pid);if(!p)return;const t=i===null?null:p.tasks[i];openModal(t?'ویرایش وظیفه':'افزودن وظیفه',`<form data-form="task" data-pid="${h(pid)}" data-i="${i===null?'':i}"><div class="field"><label>شرح کار</label><textarea name="text" required maxlength="5000" placeholder="چه کاری باید انجام بشه؟">${h(t?.text||'')}</textarea></div><div class="formgrid">${formSelect('priority','درجه اهمیت',PRIS,pri(t||{}))}${formSelect('status','وضعیت',STAT,t?status(t):'todo')}</div><div class="formgrid">${jalaliField('due','تاریخ سررسید',t?.due||'',true)}${t?'':formSelect('repeat','تکرار اختیاری',FREQ,'none')}</div><p class="muted">تاریخ‌ها را به شمسی انتخاب کن. برای تکرار، تعیین سررسید الزامی است.</p><div class="modalactions"><button class="btn secondary" type="button" data-action="close-modal">انصراف</button><button class="btn primary" type="submit">${icon('save')} ذخیره وظیفه</button></div></form>`)}
function projectDetail(pid){const p=projectById(pid);if(!p)return;const ts=activeT(p);openModal(p.name,`<div class="rowbetween"><span class="pill">${progress(p).toLocaleString('fa-IR')}٪ پیشرفت</span><span class="muted">${fmt(p.start)} تا ${fmt(p.end)}</span></div><div class="progress" style="margin:13px 0"><span style="width:${progress(p)}%"></span></div>${p.note?`<div class="notice">${h(p.note)}</div>`:''}<div class="modalnav"><button class="btn primary" data-action="task-for-project" data-pid="${h(pid)}">${icon('plus')} وظیفه جدید</button><button class="btn secondary" data-action="edit-project" data-pid="${h(pid)}">${icon('edit')} ویرایش پروژه</button><button class="btn danger" data-action="archive-project" data-pid="${h(pid)}">${icon('trash')} بایگانی</button></div><div class="sectionhead"><div><h2>وظایف پروژه</h2><p>${ts.length.toLocaleString('fa-IR')} وظیفه</p></div></div><div class="projecttasks">${ts.map(t=>`<div class="detailtask ${t.done?'done':''}"><button class="mini-check ${t.done?'isdone':''}" data-action="toggle-task" data-pid="${h(pid)}" data-i="${t._i}">${icon('check')}</button><div class="detailbody"><strong>${h(t.text)}</strong><small>${priorityBadge(t)} · ${t.due?fmt(t.due):'بدون موعد'} · ${status(t)==='doing'?'در حال انجام':t.done?'تکمیل‌شده':'برای انجام'}</small></div><div class="detailtools"><button class="btn secondary icononly small" title="ویرایش" data-action="edit-task" data-pid="${h(pid)}" data-i="${t._i}">${icon('edit')}</button><button class="btn danger icononly small" title="حذف قابل بازیابی" data-action="delete-task" data-pid="${h(pid)}" data-i="${t._i}">${icon('trash')}</button></div></div>`).join('')||empty('هنوز وظیفه‌ای ثبت نشده','اولین وظیفه را به پروژه اضافه کنید.')}</div>`,true)}
function recurringForm(){const ps=activeP();if(!ps.length)return toast('ابتدا یک پروژه جدید بسازید.',true);openModal('برنامه تکرارشونده جدید',`<form data-form="recurring"><div class="field"><label>شرح وظیفه تکراری</label><textarea name="text" required placeholder="مثل بررسی و ارسال گزارش هفتگی"></textarea></div><div class="formgrid">${formSelect('pid','پروژه',ps.map(p=>[p.id,p.name]),ps[0].id)}${formSelect('freq','دوره تکرار',FREQ.slice(1),'weekly')}</div><div class="formgrid">${jalaliField('nextDate','تاریخ اولین سررسید',today())}${formSelect('priority','اولویت',PRIS,'normal')}</div><div class="modalactions"><button type="button" class="btn secondary" data-action="close-modal">انصراف</button><button type="submit" class="btn primary">${icon('save')} ثبت برنامه</button></div></form>`)}
async function toggleTask(pid,i){const p=projectById(pid),t=p?.tasks?.[i];if(!t)return;await changeTaskStatus(pid,i,t.done?'todo':'done')}
async function changeTaskStatus(pid,i,s){const ok=await update(pid,s==='done'?'تکمیل وظیفه':s==='doing'?'شروع انجام وظیفه':'تغییر وضعیت وظیفه',p=>{let t=p.tasks[i];if(!t||t.deletedAt)throw Error('وظیفه در دسترس نیست');t.done=s==='done';t.status=s;t.completedAt=s==='done'?(t.completedAt||new Date().toISOString()):null});if(ok&&document.querySelector('#modalRoot .modal'))projectDetail(pid)}
async function scheduleToday(pid,i){await update(pid,'برنامه‌ریزی وظیفه برای امروز',p=>{p.tasks[i].due=today()})}
async function submitProject(f){const v=new FormData(f),pid=f.dataset.pid,name=String(v.get('name')||'').trim(),start=v.get('start'),end=v.get('end'),note=String(v.get('note')||'');if(!name)return toast('نام پروژه را بنویسید',true);if(start>end)return toast('پایان پروژه نمی‌تواند پیش از شروع باشد',true);let ok;if(pid)ok=await update(pid,'ویرایش اطلاعات پروژه',p=>Object.assign(p,{name,start,end,note}));else ok=await commit(arr=>arr.unshift({id:uid(),name,start,end,note,progress:0,tasks:[],recurring:[],history:[{id:uid(),at:new Date().toISOString(),label:'ایجاد پروژه',type:'create',before:null}]}),'پروژه جدید ثبت شد');if(ok)closeModal()}
async function submitTask(f){const v=new FormData(f),pid=f.dataset.pid,i=f.dataset.i===''?null:Number(f.dataset.i),txt=String(v.get('text')||'').trim(),due=String(v.get('due')||''),priority=String(v.get('priority')||'normal'),s=String(v.get('status')||'todo'),repeat=String(v.get('repeat')||'none');if(!txt)return toast('شرح وظیفه را وارد کنید',true);if(repeat!=='none'&&!due&&i===null)return toast('برای وظیفه تکراری تاریخ سررسید لازم است',true);const ok=await update(pid,i===null?'افزودن وظیفه':'ویرایش وظیفه',p=>{if(i===null){const newTask={id:uid(),text:txt,priority,due,done:s==='done',status:s,createdAt:new Date().toISOString(),completedAt:s==='done'?new Date().toISOString():null};if(repeat!=='none'){const rid=uid();newTask.sourceRecurringId=rid;p.recurring.push({id:rid,text:txt,priority,freq:repeat,anchorDay:Number(due.slice(8,10)),nextDate:nextOccurrence(due,repeat),enabled:true})}p.tasks.push(newTask)}else{const t=p.tasks[i];if(!t||t.deletedAt)throw Error('وظیفه پیدا نشد');t.text=txt;t.due=due;t.priority=priority;t.status=s;t.done=s==='done';t.completedAt=s==='done'?(t.completedAt||new Date().toISOString()):null}});if(ok){closeModal();if(state.view==='projects')projectDetail(pid)}}
async function submitRecurring(f){const v=new FormData(f),pid=String(v.get('pid')),txt=String(v.get('text')||'').trim(),freq=String(v.get('freq')),nextDate=String(v.get('nextDate')),priority=String(v.get('priority'));if(!txt||!nextDate)return toast('شرح و تاریخ الزامی است',true);const ok=await update(pid,'ثبت برنامه تکرارشونده',p=>p.recurring.push({id:uid(),text:txt,freq,priority,nextDate,anchorDay:Number(nextDate.slice(8,10)),enabled:true}));if(ok)closeModal()}
async function runRecurring(){if(!activeP().some(p=>(p.recurring||[]).some(r=>r.enabled!==false&&r.nextDate&&r.nextDate<=today()))){toast('نوبت جدیدی برای ایجاد وجود نداشت');return}let total=0;const ok=await commit(arr=>{for(const p of arr){if(p.archived)continue;ensure(p);let num=0;const before=snapshot(p);for(const r of p.recurring){if(r.enabled===false||!r.nextDate||!['daily','weekly','monthly'].includes(r.freq))continue;let i=0;while(r.nextDate<=today()&&i<30){const due=r.nextDate;if(!p.tasks.some(t=>t.sourceRecurringId===r.id&&t.due===due)){p.tasks.push({id:uid(),text:r.text,done:false,status:'todo',priority:pri(r),due,sourceRecurringId:r.id,createdAt:new Date().toISOString()});num++;total++}r.nextDate=nextOccurrence(r.nextDate,r.freq,r.anchorDay);i++} }if(num){recalc(p);writeHistory(p,`ایجاد ${num.toLocaleString('fa-IR')} نوبت تکراری`,before,'recurring')}}},'نوبت‌های سررسید ساخته شدند');if(ok&&total===0)toast('نوبت جدیدی برای ایجاد وجود نداشت')}
async function restoreEvent(pid,eid){const p=projectById(pid),ev=(p?.history||[]).find(x=>x.id===eid);if(!ev?.before)return;if(!confirm('این پروژه به وضعیت قبل از رویداد انتخاب‌شده بازگردانده شود؟ تغییرات جدیدتر در این پروژه لغو می‌شوند.'))return;await update(pid,'بازیابی نسخه قبلی پروژه',obj=>{const before=JSON.parse(JSON.stringify(ev.before));for(const key of Object.keys(obj)){if(key!=='history')delete obj[key]}Object.assign(obj,before)},'restore')}
function download(name,data,type){const b=new Blob([data],{type});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function csvEscape(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCsv(){const lines=[['پروژه','وظیفه','وضعیت','اولویت','سررسید میلادی','سررسید شمسی','تاریخ تکمیل','درصد پیشرفت']];for(const p of activeP())for(const t of activeT(p))lines.push([p.name,t.text,({todo:'برای انجام',doing:'در حال انجام',done:'انجام‌شده'})[status(t)],priName(pri(t)),t.due||'',fmt(t.due),t.completedAt||'',progress(p)]);download('project-tracker-report-'+today()+'.csv','\ufeff'+lines.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download('project-tracker-backup-'+today()+'.json',JSON.stringify(state.projects,null,2),'application/json;charset=utf-8')}
function printReport(){const n=counts();const body=`<h1>گزارش عملکرد پروژه‌یار</h1><p>تاریخ: ${fmt(today())}</p><p>پروژه‌های فعال: ${n.ps.length} | کارهای انجام‌شده: ${n.done.length} | کارهای باز: ${n.open.length} | کارهای معوق: ${n.overdue.length}</p><table border="1" cellspacing="0" cellpadding="8" width="100%"><thead><tr><th>نام پروژه</th><th>پیشرفت</th><th>وظایف</th><th>موعد پایان</th></tr></thead><tbody>${n.ps.map(p=>`<tr><td>${h(p.name)}</td><td>${progress(p)}٪</td><td>${activeT(p).length}</td><td>${fmt(p.end)}</td></tr>`).join('')}</tbody></table>`;const w=window.open('','_blank');if(!w)return toast('اجازه باز شدن پنجره چاپ داده نشده است.',true);w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>گزارش پروژه‌یار</title><style>body{font:14px Tahoma,sans-serif;padding:25px;line-height:2;color:#111}table{border-collapse:collapse}th{background:#eee}</style></head><body>${body}</body></html>`);w.document.close();w.focus();w.print()}
// Event delegation: all actions are backed by current application state.
document.addEventListener('click',async e=>{const viewBtn=e.target.closest('[data-view]');if(viewBtn){go(viewBtn.dataset.view);return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,pid=btn.dataset.pid,i=Number(btn.dataset.i);if(a==='shade'){if(e.target===btn)closeModal();return}if(a==='close-modal'){closeModal();return}if(a==='more-menu'){document.querySelector('#morePanel').classList.toggle('hidden');return}if(a==='new-project')return projectForm();if(a==='new-task')return chooseProject();if(a==='new-recurring')return recurringForm();if(a==='project-detail')return projectDetail(pid);if(a==='edit-project')return projectForm(projectById(pid));if(a==='task-for-project')return taskForm(pid);if(a==='edit-task')return taskForm(pid,i);if(a==='toggle-task')return toggleTask(pid,i);if(a==='schedule-today')return scheduleToday(pid,i);if(a==='run-recurring')return runRecurring();if(a==='reload')return load();if(a==='export-backup')return backup();if(a==='export-csv')return exportCsv();if(a==='print-report')return printReport();if(a==='archive-project'){if(confirm('پروژه بایگانی شود؟ از بخش تاریخچه قابل بازگردانی است.')){const ok=await update(pid,'بایگانی پروژه',p=>p.archived=true);if(ok)closeModal()}return}if(a==='unarchive')return update(pid,'بازگردانی پروژه از بایگانی',p=>p.archived=false);if(a==='delete-task'){if(confirm('وظیفه به صورت قابل بازیابی حذف شود؟')){const ok=await update(pid,'حذف وظیفه',p=>p.tasks[i].deletedAt=new Date().toISOString());if(ok)projectDetail(pid)}return}if(a==='toggle-recurring')return update(pid,'تغییر وضعیت برنامه تکراری',p=>{const r=p.recurring.find(x=>x.id===btn.dataset.rid);if(r)r.enabled=r.enabled===false});if(a==='delete-recurring'){if(confirm('برنامه تکرار حذف شود؟ وظایف قبلی باقی می‌مانند.'))return update(pid,'حذف برنامه تکراری',p=>p.recurring=p.recurring.filter(r=>r.id!==btn.dataset.rid));return}if(a==='restore-event')return restoreEvent(pid,btn.dataset.eid)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();if(f.dataset.form==='project')submitProject(f);if(f.dataset.form==='task')submitTask(f);if(f.dataset.form==='recurring')submitRecurring(f)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.action==='task-status')changeTaskStatus(t.dataset.pid,Number(t.dataset.i),t.value);if(t.matches('[data-date-part],[data-no-date]'))updateJalaliField(t.closest('.jalali-field'))});
document.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b){state.filters=b.dataset.filter;render()}});
document.addEventListener('input',e=>{if(e.target.id==='projectSearch'){state.search=e.target.value;const ps=activeP().filter(p=>(state.filters==='all'||state.filters==='pending'&&progress(p)<100||state.filters==='completed'&&progress(p)===100||state.filters==='late'&&isOverdue(p))&&((p.name+' '+(p.note||'')+' '+activeT(p).map(t=>t.text).join(' ')).toLocaleLowerCase('fa').includes(state.search.toLocaleLowerCase('fa'))));document.querySelector('#filteredProjects').innerHTML=ps.map(projectCard).join('')||empty('موردی پیدا نشد','عبارت جستجو را تغییر بده.')}});
let drag=null;document.addEventListener('dragstart',e=>{const card=e.target.closest('.kan-card');if(!card)return;drag={pid:card.dataset.dragPid,i:Number(card.dataset.dragI)};e.dataTransfer.setData('text/plain',JSON.stringify(drag));e.dataTransfer.effectAllowed='move';card.classList.add('dragging')});document.addEventListener('dragend',e=>{drag=null;document.querySelectorAll('.kan-col').forEach(x=>x.classList.remove('over'));document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'))});document.addEventListener('dragover',e=>{const col=e.target.closest('[data-drop]');if(col){e.preventDefault();col.classList.add('over')}});document.addEventListener('dragleave',e=>{const col=e.target.closest('[data-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop]');if(!col)return;e.preventDefault();col.classList.remove('over');let value=drag;try{value=value||JSON.parse(e.dataTransfer.getData('text/plain'))}catch{}if(value?.pid&&Number.isInteger(value.i))changeTaskStatus(value.pid,value.i,col.dataset.drop)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
load();
</script>
</body></html>
